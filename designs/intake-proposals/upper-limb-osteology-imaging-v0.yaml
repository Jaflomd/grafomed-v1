mastery_atom_changes:
  retire_as_atom_and_replace_with_cluster:
    - gm-ma-identify-upper-limb-long-flat-bones
  replace_with:
    - id: gm-ma-orient-clavicle
      objective: Orienta una clavícula aislada y justifica lado y posición mediante reparos definidos.
      evidence_object_refs: [gm-anatomy-clavicle, gm-anatomy-clavicle-sternal-end, gm-anatomy-clavicle-acromial-end, gm-anatomy-clavicle-conoid-tubercle]
    - id: gm-ma-orient-scapula
      objective: Orienta una escápula aislada y justifica lado y posición mediante reparos definidos.
      evidence_object_refs: [gm-anatomy-scapula, gm-anatomy-scapular-spine, gm-anatomy-acromion, gm-anatomy-coracoid-process, gm-anatomy-glenoid-cavity]
    - id: gm-ma-orient-humerus
      objective: Orienta un húmero aislado y justifica lado, extremo y cara mediante reparos definidos.
      evidence_object_refs: [gm-anatomy-humerus, gm-anatomy-humeral-head, gm-anatomy-humeral-surgical-neck, gm-anatomy-humeral-radial-groove, gm-anatomy-humeral-capitulum, gm-anatomy-humeral-trochlea, gm-anatomy-humeral-olecranon-fossa]
    - id: gm-ma-distinguish-orient-radius-ulna
      objective: Distingue y orienta radio y ulna mediante sus extremos, reparos y relación en posición anatómica.
      evidence_object_refs: [gm-anatomy-radius, gm-anatomy-ulna, gm-anatomy-radial-head, gm-anatomy-radial-tuberosity, gm-anatomy-radial-styloid, gm-anatomy-olecranon, gm-anatomy-ulnar-trochlear-notch, gm-anatomy-ulnar-head, gm-anatomy-ulnar-styloid]
  split_existing:
    - from: gm-ma-identify-wrist-hand-bones
      into:
        - id: gm-ma-map-carpal-bones
          objective: Identifica los ocho carpianos y reconstruye sus filas y relaciones radial-ulnar.
        - id: gm-ma-map-metacarpals-phalanges
          objective: Identifica metacarpianos y falanges y determina número, orientación y posición relativa.
    - from: gm-ma-interpret-upper-limb-imaging
      into:
        - id: gm-ma-identify-upper-limb-anatomy-on-standard-images
          objective: Identifica anatomía del miembro superior en imágenes estándar nuevas después de orientar modalidad, plano o proyección.
        - id: gm-ma-recognize-common-upper-limb-osseous-injury-patterns
          objective: Localiza una lesión ósea frecuente del miembro superior y describe hueso, segmento, alineación y articulación vecina.
  add:
    - id: gm-ma-localize-upper-limb-surface-landmarks
      objective: Localiza en superficie reparos óseos definidos de hombro, codo, muñeca y mano y los vincula con la estructura subyacente.
  retain_and_rewire:
    - gm-ma-map-neurovascular-risk-by-injury
    - gm-ma-predict-functional-effect-neurovascular-injury

transversal_dependencies_to_design_separately:
