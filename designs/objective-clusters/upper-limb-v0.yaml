  entities:
    - {id: gm-anatomy-clavicle, label: Clavícula, parent_ref: gm-anatomy-upper-limb-skeleton, definition: Hueso de la cintura pectoral que conecta el miembro superior con el esqueleto axial.}
    - {id: gm-anatomy-scapula, label: Escápula, parent_ref: gm-anatomy-upper-limb-skeleton, definition: Hueso plano de la cintura pectoral que contiene la cavidad glenoidea y múltiples inserciones musculares.}
    - {id: gm-anatomy-humerus, label: Húmero, parent_ref: gm-anatomy-upper-limb-skeleton, definition: Hueso del brazo relacionado con hombro, codo y trayectos neurovasculares vulnerables.}
    - {id: gm-anatomy-radius, label: Radio, parent_ref: gm-anatomy-upper-limb-skeleton, definition: Hueso lateral del antebrazo que participa de manera principal en la articulación de la muñeca.}
