cluster_contract:
  level: presentation_cluster
  objective: >-
    Integra osteología, articulaciones, músculos, fascia, vasos, linfáticos y
    nervios del miembro superior para interpretar imágenes, explorar función y
    localizar consecuencias de lesiones frecuentes.
  expected_performance: >-
    El estudiante identifica estructuras y relaciones, explica movimiento y
    estabilidad, reconstruye trayectos neurovasculares, localiza pulsos y acceso
    venoso, examina función motora y sensitiva, y aplica la anatomía a trauma,
    atrapamiento nervioso, infección y síndrome compartimental en simulación.
  mastery_evidence: >-
    Requiere desempeño agregado en modelos, superficie corporal, imágenes y
    casos nuevos. Ninguna modalidad, MCQ o demostración aislada certifica el
    cluster completo.
  threshold_status: empirical_threshold_not_set

boundaries:
  included:
    - osteología y relaciones espaciales del miembro superior
    - plexo braquial, nervios terminales, dermatomos y exploración funcional
    - arterias, pulsos, venas, acceso venoso y drenaje linfático axilar
    - cintura escapular, hombro, axila, codo, radiocubital, muñeca y mano
    - grupos musculares, agarres, retináculos, vainas y compartimentos fasciales
    - anatomía aplicada a fractura, luxación, túnel carpiano, infección y síndrome compartimental
    - radiografía, CT, MRI y ultrasonido a nivel anatómico básico
  excluded:
    - tratamiento completo de fracturas, luxaciones o lesiones nerviosas
    - cirugía, rehabilitación y prescripción terapéutica longitudinal
    - técnica completa de acceso vascular, reducción articular o fasciotomía
    - certificación de desempeño clínico independiente sobre pacientes

