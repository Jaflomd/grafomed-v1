assessment_model:
  levels:
    - {code: A1, label: Reconocimiento anatómico, meaning: Identifica, orienta o clasifica estructuras en modelos, superficie o imágenes.}
    - {code: A2, label: Explicación funcional, meaning: Explica relaciones entre estructura, movimiento, estabilidad, perfusión o función neural.}
    - {code: A3, label: Aplicación clínica o procedimental, meaning: Usa la anatomía para explorar, localizar una lesión o planificar una acción simulada.}
    - {code: A4, label: Transferencia multimodal, meaning: Resuelve un caso nuevo integrando anatomía, imagen y desempeño simulado.}
  rules:
    - Cada mastery atom declara un único objetivo observable.
    - Las entidades de conocimiento no requieren objetivo propio.
    - Los niveles son tipos de evidencia, no objetivos adicionales dentro del nodo.
    - La aprobación exige muestreo entre modalidades, regiones y casos nuevos.

