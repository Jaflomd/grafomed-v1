  entities:
    - id: gm-anatomy-vertebra-general
      label: "Vértebra: patrón estructural general"
      granularity: structural_archetype
      region: transregional
      definition: >-
        Unidad ósea del eje vertebral representada por un cuerpo y un arco
        vertebral con procesos, sujeta a modificaciones regionales y excepciones.
      discriminating_features:
        - cuerpo vertebral y arco que delimitan el foramen vertebral
        - procesos articulares, transversos y espinoso en el patrón general
        - variación regional según carga, movilidad y articulaciones asociadas
      aliases: [vértebra típica general, patrón vertebral]
      source_refs:
        - gm-source-anatomical-society-regional-anatomy-syllabus-2016
        - gm-source-statpearls-cervical-vertebrae-2026
    - id: gm-anatomy-atlas-c1
      label: "Atlas (C1)"
      granularity: individual_distinctive_vertebra
      region: cervical
      definition: >-
        Primera vértebra cervical, formada principalmente por arcos y masas
        laterales y sin cuerpo ni proceso espinoso en el patrón adulto habitual.
      discriminating_features:
        - ausencia de cuerpo vertebral
        - ausencia de proceso espinoso
        - masas laterales que articulan con cóndilos occipitales y axis
      aliases: [C1, primera vértebra cervical]
      source_refs: [gm-source-statpearls-cervical-vertebrae-2026]
    - id: gm-anatomy-axis-c2
      label: "Axis (C2)"
      granularity: individual_distinctive_vertebra
      region: cervical
      definition: >-
        Segunda vértebra cervical, distinguida por el proceso odontoides o dens
        que se proyecta superiormente y participa en la rotación atlantoaxial.
      discriminating_features:
        - dens o proceso odontoides
        - cuerpo vertebral que transmite carga hacia C3
        - superficies articulares especializadas para el atlas
      aliases: [C2, segunda vértebra cervical, epistrofeo]
      source_refs: [gm-source-statpearls-cervical-vertebrae-2026]
    - id: gm-anatomy-cervical-typical-c3-c6
      label: "Vértebras cervicales típicas (C3–C6)"
      granularity: regional_morphotype
      region: cervical
      definition: >-
        Morfotipo cervical subaxial usado para reconocer C3 a C6 por su conjunto
        de rasgos regionales, admitiendo variación entre niveles e individuos.
      discriminating_features:
        - forámenes transversos
        - cuerpo relativamente pequeño y foramen vertebral amplio
        - procesos unciformes y proceso espinoso frecuentemente bífido
      aliases: [cervical típica, C3-C6]
      source_refs: [gm-source-statpearls-cervical-vertebrae-2026]
    - id: gm-anatomy-cervical-c7
      label: "C7 o vértebra prominente"
      granularity: individual_transitional_vertebra
      region: cervical
      definition: >-
        Séptima vértebra cervical con rasgos transicionales; puede clasificarse
        como típica o atípica según la convención anatómica utilizada.
      discriminating_features:
        - proceso espinoso largo y habitualmente no bífido
        - foramen transverso pequeño con trayecto arterial variable
        - transición morfológica hacia la región torácica
      aliases: [C7, vertebra prominens, séptima vértebra cervical]
      source_refs: [gm-source-statpearls-cervical-vertebrae-2026]
      epistemic_note: La clasificación típica versus atípica de C7 no es universal; el nodo conserva explícitamente esa variación.
    - id: gm-anatomy-thoracic-typical
      label: "Patrón torácico típico (T5–T8 representativas)"
      granularity: regional_morphotype
      region: thoracic
      definition: >-
        Morfotipo torácico típico representado con mayor claridad por T5 a T8
        y caracterizado por superficies articulares para las costillas.
      discriminating_features:
        - facetas o hemifacetas costales
        - cuerpo de contorno aproximadamente cardíaco y foramen relativamente circular
        - proceso espinoso largo con dirección posteroinferior
      aliases: [torácica típica, patrón torácico medio]
      source_refs: [gm-source-statpearls-thoracic-vertebrae-2026]
    - id: gm-anatomy-thoracic-atypical
      label: "Vértebras torácicas atípicas"
      granularity: regional_exception_set
      region: thoracic
      definition: >-
        Conjunto de vértebras torácicas cuyo patrón de facetas costales o su
        morfología transicional difiere del patrón torácico medio.
      members:
        fixed: [T1, T11, T12]
        variable_or_transitional: [T9, T10]
      discriminating_features:
        - T1 posee una faceta costal superior completa y hemifaceta inferior
        - T11 y T12 poseen facetas costales completas y carecen de facetas costales transversas
        - T10 y el patrón de T9 pueden variar; T12 es transicional hacia lumbar
      aliases: [torácicas especiales, torácicas transicionales]
      source_refs: [gm-source-statpearls-thoracic-vertebrae-2026]
      epistemic_note: T9 y T10 se conservan como patrón variable, no como una lista rígida universal.
    - id: gm-anatomy-lumbar-typical-l1-l4
      label: "Vértebras lumbares típicas (L1–L4)"
      granularity: regional_morphotype
      region: lumbar
      definition: >-
        Morfotipo lumbar de L1 a L4, adaptado a carga axial y a flexión-extensión
        con restricción relativa de la rotación axial.
      discriminating_features:
        - cuerpo vertebral grande
        - proceso espinoso corto, grueso y casi horizontal
        - facetas con orientación predominantemente sagital y procesos mamilares
      aliases: [lumbar típica, L1-L4]
      source_refs: [gm-source-statpearls-lumbar-vertebrae-2026]
    - id: gm-anatomy-lumbar-l5
      label: "L5"
      granularity: individual_transitional_vertebra
      region: lumbar
      definition: >-
        Quinta vértebra lumbar, de morfología adaptada a la transición
        lumbosacra y considerada la principal vértebra lumbar atípica.
      discriminating_features:
        - cuerpo y procesos transversos de gran tamaño
        - altura anterior del cuerpo mayor que la posterior
        - contribución al ángulo lumbosacro
      aliases: [quinta vértebra lumbar]
      source_refs: [gm-source-statpearls-lumbar-vertebrae-2026]
    - id: gm-anatomy-sacrum
      label: "Sacro"
      granularity: fused_vertebral_complex
      region: sacral
      definition: >-
        Complejo óseo triangular formado habitualmente por cinco vértebras
        sacras fusionadas y atravesado por el canal y los forámenes sacros.
      discriminating_features:
        - cinco segmentos fusionados en el patrón habitual
        - canal sacro y hiato sacro
        - cuatro pares de forámenes sacros anteriores y posteriores
      aliases: [vértebras sacras fusionadas, S1-S5]
      source_refs: [gm-source-statpearls-sacral-vertebrae-2023]
    - id: gm-anatomy-coccyx
      label: "Cóccix"
      granularity: fused_or_partly_fused_vertebral_complex
      region: coccygeal
      definition: >-
        Porción terminal de la columna formada habitualmente por tres a cinco
        segmentos coccygeales, con cuatro como patrón frecuente y fusión variable.
      discriminating_features:
        - tres a cinco segmentos con frecuencia cuatro
        - reducción progresiva de tamaño hacia caudal
        - ausencia del patrón completo de pedículos, láminas y proceso espinoso
      aliases: [vértebras coccygeales, Co1-Co4]
      source_refs: [gm-source-statpearls-coccygeal-vertebrae-2023]
  relations:
    - {id: gm-rel-atlas-subtype-vertebra, source: gm-anatomy-atlas-c1, target: gm-anatomy-vertebra-general, relation_type: anatomical_subtype_of, source_refs: [gm-source-statpearls-cervical-vertebrae-2026]}
