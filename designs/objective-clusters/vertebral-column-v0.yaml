assessment_model:
  levels:
    - code: A1
      label: Reconocimiento anatómico
      meaning: Identifica, orienta o clasifica estructuras en modelos, piezas, diagramas o imágenes.
    - code: A2
      label: Explicación funcional
      meaning: Explica relaciones entre estructura, carga, estabilidad, movimiento o función neural.
    - code: A3
      label: Aplicación clínica o procedimental
      meaning: Usa la anatomía para resolver un caso, localizar una lesión o planificar un procedimiento simulado.
    - code: A4
      label: Transferencia multimodal
      meaning: Resuelve un caso nuevo integrando anatomía, imagen y desempeño simulado sin depender del ejemplo enseñado.
  rules:
    - Cada mastery atom declara un único objetivo observable.
    - Los niveles de assessment son tipos de evidencia, no cuatro objetivos dentro del nodo.
    - La asistencia recibida debe registrarse; desempeño con pistas no equivale a desempeño independiente.
    - La aprobación del cluster exige muestreo entre modalidades y casos, no repetición del mismo ítem.
    - Los umbrales numéricos permanecen propuestos hasta contar con validación.

knowledge_entity_layer:
  status: source_locked_candidate_not_promoted
  layer: medical_truth
  object_type: anatomical_entity
  contract:
    purpose: >-
      Representar las entidades anatómicas sobre las que actúan los objetivos
      sin convertir cada estructura en un objetivo de aprendizaje independiente.
    objective_policy: >-
      Una entidad de conocimiento no requiere objetivo propio. Solo una unidad
      declarada learner-facing mediante learning_contract tiene exactamente un
      objetivo observable.
    granularity_policy: >-
      Comenzar con morfotipos regionales y vértebras individualmente distintivas.
      Crear una vértebra individual adicional solo cuando posea una diferencia
      reutilizable, clínicamente relevante o evaluable de forma independiente.
    feature_promotion_rule: >-
      Los rasgos discriminadores permanecen como propiedades de la entidad hasta
      que se reutilicen entre varios clusters, tengan relaciones propias o se
      conviertan en un blanco evaluable independiente.
