objective_hierarchy:
  - id: gm-ko-columna-vertebral-morfologia-regional
    level: key_objective
    source_outcomes: [43]
    title: "Morfología regional de las vértebras"
    objective: >-
      Analiza la morfología de una vértebra para determinar su región y su
      carácter típico o atípico.
    rationale_for_split: >-
      El resultado 43 combina clasificación regional e identificación de
      vértebras atípicas; ambas requieren muestreo diferente.
    mastery_atoms:
      - id: gm-ma-clasificar-vertebra-por-region
        title: "Clasificar una vértebra por región"
        learning_contract:
          objective: >-
            Clasifica una vértebra aislada como cervical, torácica, lumbar,
            sacra o coccígea utilizando sus rasgos anatómicos discriminadores.
          expected_performance: >-
            El estudiante orienta el espécimen o imagen, identifica rasgos
            regionales pertinentes y justifica una sola clasificación sin
            depender de la memorización de una vista idéntica.
          mastery_evidence: >-
            Clasificación razonada de especímenes o imágenes representativos y
            nuevos de las cinco regiones, con registro separado de errores de
            orientación y discriminación.
        evidence_levels: [A1, A2, A4]
        evidence_object_refs:
          - gm-anatomy-atlas-c1
          - gm-anatomy-axis-c2
          - gm-anatomy-cervical-typical-c3-c6
          - gm-anatomy-cervical-c7
          - gm-anatomy-thoracic-typical
          - gm-anatomy-thoracic-atypical
          - gm-anatomy-lumbar-typical-l1-l4
          - gm-anatomy-lumbar-l5
          - gm-anatomy-sacrum
          - gm-anatomy-coccyx
      - id: gm-ma-reconocer-vertebras-atipicas
        title: "Reconocer atlas, axis y otras vértebras atípicas"
        learning_contract:
          objective: >-
            Reconoce atlas, axis y otras vértebras atípicas relevantes a partir
            de sus características distintivas.
          expected_performance: >-
            El estudiante identifica la pieza o imagen y señala los rasgos que
            explican su clasificación y función regional.
          mastery_evidence: >-
            Identificación justificada en modelos o imágenes no idénticos a los
            usados durante la enseñanza, incluyendo atlas y axis como muestras obligatorias.
        evidence_levels: [A1, A2, A4]
        evidence_object_refs:
          - gm-anatomy-atlas-c1
          - gm-anatomy-axis-c2
          - gm-anatomy-cervical-c7
          - gm-anatomy-thoracic-atypical
          - gm-anatomy-lumbar-l5

  - id: gm-ko-columna-vertebral-articulaciones-discos
    level: key_objective
    source_outcomes: [44]
    title: "Articulaciones intervertebrales, discos y compresión neural"
    objective: >-
      Relaciona la estructura de las articulaciones y discos intervertebrales
      con la transmisión de cargas, el movimiento y la compresión neurológica.
    rationale_for_split: >-
      Explicar biomecánica normal y predecir la consecuencia de una lesión
      discal son desempeños que pueden aprobarse o fallarse por separado.
    mastery_atoms:
      - id: gm-ma-explicar-biomecanica-intervertebral
        title: "Explicar la biomecánica intervertebral"
        learning_contract:
          objective: >-
            Explica cómo los cuerpos vertebrales, discos y articulaciones
            cigapofisarias distribuyen carga y guían el movimiento.
          expected_performance: >-
            El estudiante integra estructura y función sin convertir el disco
            en el único elemento de estabilidad ni confundir articulaciones intercorporales y posteriores.
          mastery_evidence: >-
            Explicación causal aplicada a un segmento vertebral y predicción de
            cómo cambia la carga o el movimiento al alterar uno de sus componentes.
        evidence_levels: [A2, A3, A4]
      - id: gm-ma-predecir-compresion-por-lesion-discal
        title: "Predecir la compresión neural por una lesión discal"
        learning_contract:
          objective: >-
            Predice la estructura neurológica susceptible de compresión a
            partir del nivel y la dirección de una lesión discal.
          expected_performance: >-
            El estudiante usa las relaciones entre disco, canal, foramen y
            raíces; no diagnostica una radiculopatía únicamente por dolor inespecífico.
          mastery_evidence: >-
            Localización razonada en casos anatómicos e imágenes con variación
            de nivel, región y dirección de la lesión.
        evidence_levels: [A2, A3, A4]

  - id: gm-ko-columna-vertebral-curvaturas-movimiento-lesion
    level: key_objective
    source_outcomes: [45]
    title: "Curvaturas, movimiento regional y lesiones"
    objective: >-
      Explica cómo la organización regional de la columna determina sus
      curvaturas, movimientos y patrones de lesión.
    rationale_for_split: >-
      El resultado 45 reúne función global, movilidad regional y lesión; cada
      componente necesita una tarea de transferencia diferente.
    mastery_atoms:
      - id: gm-ma-relacionar-curvaturas-con-funcion
        title: "Relacionar las curvaturas con la función vertebral"
        learning_contract:
          objective: >-
            Relaciona las curvaturas fisiológicas de la columna con soporte,
            distribución de carga y equilibrio postural.
          expected_performance: >-
            El estudiante reconoce curvaturas regionales normales y explica su
            contribución funcional sin confundir variación postural con deformidad estructural.
          mastery_evidence: >-
            Interpretación de modelos o imágenes sagitales y explicación de
            las consecuencias funcionales de una alteración propuesta.
        evidence_levels: [A1, A2, A3]
      - id: gm-ma-predecir-movimiento-vertebral-regional
        title: "Predecir el movimiento vertebral regional"
        learning_contract:
          objective: >-
            Predice el movimiento predominante y sus limitaciones en una región
            vertebral a partir de su anatomía articular y ligamentaria.
          expected_performance: >-
            El estudiante diferencia flexión, extensión, inclinación y rotación
            regionales y justifica el patrón desde la geometría anatómica.
          mastery_evidence: >-
            Predicción razonada en regiones distintas y transferencia a una
            postura o mecanismo de lesión nuevo.
        evidence_levels: [A2, A3, A4]
      - id: gm-ma-explicar-base-anatomica-lesion-vertebral
        title: "Explicar la base anatómica de una lesión vertebral"
        learning_contract:
          objective: >-
            Explica la base anatómica y la consecuencia estructural probable de
            un mecanismo frecuente de lesión vertebral.
          expected_performance: >-
            El estudiante conecta fuerza, región, estructuras vulnerables y
            posible inestabilidad sin pretender realizar una clasificación traumatológica completa.
          mastery_evidence: >-
            Resolución de escenarios variados, incluyendo al menos un mecanismo
            cervical y uno toracolumbar, con justificación anatómica.
        evidence_levels: [A2, A3, A4]

  - id: gm-ko-columna-vertebral-superficie-estabilidad-examen
    level: key_objective
    source_outcomes: [46]
    title: "Anatomía de superficie, estabilidad y examen de la espalda"
    objective: >-
      Aplica músculos, ligamentos y referencias superficiales para explicar la
      estabilidad y realizar una exploración anatómica de la espalda.
    rationale_for_split: >-
      Identificar referencias, explicar función y ejecutar un examen son
      desempeños diferentes y requieren modalidades de evaluación distintas.
    mastery_atoms:
      - id: gm-ma-identificar-referencias-superficiales-espalda
        title: "Identificar referencias superficiales de la espalda"
        learning_contract:
          objective: >-
            Identifica las referencias superficiales principales necesarias
            para orientar un examen de la espalda.
          expected_performance: >-
            El estudiante localiza referencias en modelo o persona simulada y
            reconoce la incertidumbre propia de la palpación y la variación corporal.
          mastery_evidence: >-
            Identificación observada en más de un cuerpo o simulador y
            correlación con una representación anatómica subyacente.
        evidence_levels: [A1, A3, A4]
      - id: gm-ma-explicar-estabilidad-musculoligamentaria
        title: "Explicar la estabilidad musculoligamentaria"
        learning_contract:
          objective: >-
            Explica cómo los principales grupos musculares y ligamentos
            contribuyen al movimiento y la estabilidad vertebral.
          expected_performance: >-
            El estudiante relaciona estructura, tensión y acción regional y
            distingue estabilización activa de restricción ligamentaria pasiva.
          mastery_evidence: >-
            Explicación funcional aplicada a un movimiento y a una alteración
            anatómica o lesión propuesta.
        evidence_levels: [A2, A3, A4]
      - id: gm-ma-realizar-examen-anatomico-espalda
        title: "Realizar un examen anatómico estructurado de la espalda"
        learning_contract:
          objective: >-
            Realiza una exploración anatómica estructurada de la espalda
            utilizando referencias superficiales, alineación y movimiento.
          expected_performance: >-
            El estudiante inspecciona, orienta, palpa cuando corresponda y
            evalúa movimientos de manera sistemática en una persona simulada;
            este nodo no certifica diagnóstico musculoesquelético completo.
          mastery_evidence: >-
            Observación directa con checklist y transferencia a una persona o
            simulador con anatomía superficial diferente.
        evidence_levels: [A3, A4]

  - id: gm-ko-columna-vertebral-meninges-procedimientos
    level: key_objective
    source_outcomes: [47]
    title: "Meninges, raíces y procedimientos neuraxiales"
    objective: >-
      Aplica las relaciones entre canal vertebral, meninges, médula y raíces
      para localizar compresión y planificar accesos neuraxiales seguros.
    rationale_for_split: >-
      Reconstruir compartimentos, planificar punción lumbar y diferenciar
      accesos epidural e intratecal son decisiones evaluables independientes.
    mastery_atoms:
      - id: gm-ma-mapear-contenido-canal-vertebral
        title: "Mapear el contenido del canal vertebral"
        learning_contract:
          objective: >-
            Reconstruye las relaciones espaciales entre canal vertebral,
            meninges, médula, cauda equina y raíces espinales.
          expected_performance: >-
            El estudiante orienta cortes y niveles y distingue espacios
            epidural, subdural potencial y subaracnoideo sin tratarlos como equivalentes.
          mastery_evidence: >-
            Reconstrucción correcta en diagramas y cortes de distinta
            orientación, seguida de aplicación a un escenario clínico o procedimental.
        evidence_levels: [A1, A2, A3, A4]
      - id: gm-ma-planificar-acceso-puncion-lumbar
        title: "Planificar anatómicamente una punción lumbar"
        learning_contract:
          objective: >-
            Selecciona un nivel y trayecto anatómico apropiados para una punción
            lumbar simulada y justifica las estructuras atravesadas y evitadas.
          expected_performance: >-
            El estudiante usa referencias superficiales y la terminación
            relativa de la médula y el saco dural; no ejecuta ni indica el
            procedimiento sobre un paciente real dentro de este nodo.
          mastery_evidence: >-
            Planificación verbal y demostrada en simulador o imagen, incluyendo
            una variante anatómica o dificultad de palpación.
        evidence_levels: [A2, A3, A4]
      - id: gm-ma-diferenciar-acceso-epidural-intratecal
        title: "Diferenciar accesos epidural e intratecal"
        learning_contract:
          objective: >-
            Diferencia el objetivo anatómico, los límites y las estructuras
            relevantes de un acceso epidural frente a uno intratecal.
          expected_performance: >-
            El estudiante localiza ambos espacios en cortes o simuladores y
            predice la consecuencia de una profundidad o trayectoria incorrecta.
          mastery_evidence: >-
            Comparación aplicada en representaciones multimodales y resolución
            de un escenario de colocación errónea.
        evidence_levels: [A1, A2, A3, A4]

  - id: gm-ko-columna-vertebral-nervio-espinal
    level: key_objective
    source_outcomes: [48]
    title: "Formación y distribución de un nervio espinal"
    objective: >-
      Reconstruye un nervio espinal típico y relaciona sus componentes con la
      distribución motora, cutánea y autonómica.
    rationale_for_split: >-
      Trazar la arquitectura del nervio y usarla para inferir un déficit son
      desempeños diferentes.
    mastery_atoms:
      - id: gm-ma-trazar-nervio-espinal-tipico
        title: "Trazar un nervio espinal típico"
        learning_contract:
          objective: >-
            Traza la formación de un nervio espinal típico desde las raíces
            dorsal y ventral hasta sus principales ramos.
          expected_performance: >-
            El estudiante mantiene la distinción entre raíz, ganglio, nervio
            espinal y ramos y asigna correctamente componentes funcionales básicos.
          mastery_evidence: >-
            Reconstrucción en diagrama y corte anatómico, seguida de
            identificación de un punto de lesión propuesto.
        evidence_levels: [A1, A2, A3]
      - id: gm-ma-inferir-deficit-nervio-espinal
        title: "Inferir un déficit desde la anatomía del nervio espinal"
        learning_contract:
          objective: >-
            Infiere el patrón funcional esperado de una lesión localizada en
            una raíz, nervio espinal o ramo principal.
          expected_performance: >-
            El estudiante diferencia componentes motores, sensitivos y
            autonómicos y evita equiparar automáticamente raíz con nervio periférico.
          mastery_evidence: >-
            Localización razonada en casos nuevos que varían el sitio de lesión
            y la información clínica disponible.
        evidence_levels: [A2, A3, A4]

  - id: gm-ko-columna-vertebral-imagen
    level: key_objective
    source_outcomes: [49]
    title: "Imagen anatómica de la columna vertebral"
    objective: >-
      Interpreta la anatomía de la columna vertebral en modalidades de imagen
      estándar y la aplica a orientación, alineación y procedimientos.
    rationale_for_split: >-
      El desempeño en radiografía no garantiza desempeño en imagen seccional o
      ultrasonido; las modalidades se muestrean por separado.
    mastery_atoms:
      - id: gm-ma-interpretar-radiografia-columna
        title: "Interpretar la anatomía vertebral en radiografía"
        learning_contract:
          objective: >-
            Orienta una radiografía de columna e identifica región, alineación
            y estructuras óseas principales.
          expected_performance: >-
            El estudiante reconoce proyección y nivel y distingue variación de
            una alteración anatómica evidente sin realizar un informe radiológico completo.
          mastery_evidence: >-
            Lectura estructurada de proyecciones y regiones diferentes,
            incluyendo una imagen nueva con alteración de alineación.
        evidence_levels: [A1, A3, A4]
      - id: gm-ma-interpretar-ct-mri-columna
        title: "Interpretar la anatomía vertebral en CT y MRI"
        learning_contract:
          objective: >-
            Localiza estructuras óseas, discales, del canal y neurales en cortes
            de CT y MRI de la columna vertebral.
          expected_performance: >-
            El estudiante orienta plano y nivel, reconoce qué estructuras
            muestra mejor cada modalidad y correlaciona hallazgos anatómicos básicos.
          mastery_evidence: >-
            Identificación y localización en cortes axiales y sagitales nuevos
            de más de una región vertebral.
        evidence_levels: [A1, A2, A3, A4]
      - id: gm-ma-identificar-ultrasonido-neuraxial
        title: "Identificar referencias neuraxiales en ultrasonido"
        learning_contract:
          objective: >-
            Identifica referencias vertebrales y neuraxiales principales en un
            ultrasonido orientado a la planificación de acceso lumbar.
          expected_performance: >-
            El estudiante reconoce orientación, línea media, interespacio y
            profundidad aproximada en imágenes o simulador; no certifica adquisición autónoma en pacientes.
          mastery_evidence: >-
            Interpretación de imágenes estáticas y demostración guiada en
            simulador con variación de ventana acústica.
        evidence_levels: [A1, A3, A4]

