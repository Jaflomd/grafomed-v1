source_lock:
  id: gm-source-anatomical-society-regional-anatomy-syllabus-2016
  citation: >-
    Smith CF, Finn GM, Stewart J, et al. The Anatomical Society core regional
    anatomy syllabus for undergraduate medicine. Journal of Anatomy.
    2016;228(1):15-23.
  doi: "10.1111/joa.12405"
  pmid: "26612592"
  pmcid: "PMC4694160"
  stable_locator: "https://doi.org/10.1111/joa.12405"
  section_used: "Vertebral column: overview and outcomes 43-49"
  evidence_role: external_consensus_curriculum_anchor
  acquisition:
    - user_provided_excerpt
    - independently_identified_by_exact_phrase_search
  access_date: "2026-08-28"
  rights_status: remote_only_transformed_synthesis
  rights_note: >-
    Bibliographic metadata, identifiers, source-outcome numbers, and a
    transformed educational synthesis are stored. The full article is not
    reproduced in this cluster draft.
  evidence_status: source_locked_candidate
  consensus_basis: modified_delphi
  limitations:
    - Es un syllabus de consenso para egresados, no una secuencia instruccional.
    - Los resultados fuente son amplios y varios contienen acciones evaluables independientes.
    - No define por sí mismo estándares de aprobación ni cantidad de observaciones.
    - Requiere contextualización curricular, clínica y procedimental local antes de promoverse.

cluster_contract:
  level: presentation_cluster
  objective: >-
    Integra la anatomía estructural, funcional, neuroanatómica e imagenológica
    de la columna vertebral para examinar la espalda, explicar lesiones
    frecuentes y planificar procedimientos neuraxiales con seguridad.
  expected_performance: >-
    El estudiante reconoce estructuras y regiones, explica estabilidad y
    movimiento, localiza relaciones entre disco, canal, meninges, raíces y
    nervios, interpreta imágenes estándar y aplica esa anatomía a la
    exploración de la espalda, la compresión neural y la planificación de una
    punción lumbar o inyección neuraxial. El cluster no certifica por sí solo
    competencia clínica independiente en dichos procedimientos.
  mastery_evidence: >-
    La conclusión de dominio requiere evidencia agregada de los mastery atoms
    relevantes y desempeño integrador en modelos anatómicos, imágenes y
    escenarios clínicos o procedimentales nuevos. Ningún MCQ, modalidad de
    imagen o demostración aislada certifica el cluster completo.
  threshold_status: empirical_threshold_not_set

boundaries:
  included:
    - osteología vertebral regional y vertebras atípicas
    - curvaturas, articulaciones, discos, ligamentos, músculos y movimiento
    - anatomía de superficie necesaria para examinar la espalda
    - canal vertebral, meninges, médula, cauda equina, raíces y nervios espinales
    - bases anatómicas de lesión discal, compresión neural y lesiones vertebrales frecuentes
    - anatomía aplicada a punción lumbar e inyecciones epidurales o intratecales
    - interpretación anatómica en radiografía, CT, MRI y ultrasonido relevante
  excluded:
    - diagnóstico y tratamiento completo de dolor lumbar
    - clasificación clínica completa de trauma raquimedular
    - farmacología y técnica completa de anestesia neuraxial
    - indicaciones, contraindicaciones y manejo de complicaciones de punción lumbar
    - rehabilitación, cirugía espinal y tratamiento longitudinal
    - certificación de ejecución independiente sobre pacientes

