open_questions:
  - Definir si ultrasonido neuraxial permanece en este cluster o en un cluster procedimental separado.
  - Definir el conjunto mínimo de vértebras atípicas más allá de atlas y axis.
  - Separar CT y MRI si la evaluación demuestra independencia material entre ambas modalidades.
  - Conectar las entidades vertebrales con nodos de imagen solo después de source-lockear ejemplos radiográficos, CT y MRI concretos.
  - Establecer estándares de muestreo y errores críticos mediante revisión anatómica y piloto.
  - Mapear las actividades integradoras a códigos AAMC Core EPA y CanMEDS específicos cuando exista el registro source-locked correspondiente.
