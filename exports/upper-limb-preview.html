.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

@media (pointer: coarse) {
  .btn,
  .form-control,
  .form-select {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control,
  .form-select {
    font-size: max(16px, var(--font-size-normal));
  }

  .form-control[type=&quot;file&quot;]::file-selector-button {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control-color[type=&quot;color&quot;] {
    width: 44px;

  }

    [type=&quot;time&quot;],

  ) {

  .form-check {

  }

  .form-check-input {
    position: relative;
  }

  .form-check-input::after {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;

  }

  .form-check-label {
    display: inline-flex;
    min-width: 44px;

  }

  .form-range {

  }

  .form-range::-webkit-slider-runnable-track {
    height: 44px;
  }

  .form-range::-moz-range-track {
    height: 44px;
  }

  .form-range::-webkit-slider-thumb {
    margin-top: 12px;
  }
}

svg {

&quot;gm-pa-examine-upper-limb&quot;,&quot;target&quot;:&quot;gm-ma-explain-pronation-supination&quot;,&quot;kind&quot;:&quot;integration&quot;},{&quot;source&quot;:&quot;gm-pa-examine-upper-limb&quot;,&quot;target&quot;:&quot;gm-ma-explain-wrist-movements&quot;,&quot;kind&quot;:&quot;integration&quot;},{&quot;source&quot;:&quot;gm-pa-examine-upper-limb&quot;,&quot;target&quot;:&quot;gm-ma-explain-finger-thumb-movements&quot;,&quot;kind&quot;:&quot;integration&quot;},{&quot;source&quot;:&quot;gm-pa-examine-upper-limb&quot;,&quot;target&quot;:&quot;gm-ma-analyze-power-precision-hook-grips&quot;,&quot;kind&quot;:&quot;integration&quot;},{&quot;source&quot;:&quot;gm-dp-localize-upper-limb-trauma-deficit&quot;,&quot;target&quot;:&quot;gm-ma-map-neurovascular-risk-by-injury&quot;,&quot;kind&quot;:&quot;integration&quot;},{&quot;source&quot;:&quot;gm-dp-localize-upper-limb-trauma-deficit&quot;,&quot;target&quot;:&quot;gm-ma-predict-functional-effect-neurovascular-injury&quot;,&quot;kind&quot;:&quot;integration&quot;},{&quot;source&quot;:&quot;gm-dp-localize-upper-limb-trauma-deficit&quot;,&quot;target&quot;:&quot;gm-ma-map-terminal-nerve-territories&quot;,&quot;kind&quot;:&quot;integration&quot;},{&quot;source&quot;:&quot;gm-dp-localize-upper-limb-trauma-deficit&quot;,&quot;target&quot;:&quot;gm-ma-perform-upper-limb-neurologic-exam&quot;,&quot;kind&quot;:&quot;integration&quot;},{&quot;source&quot;:&quot;gm-dp-localize-upper-limb-trauma-deficit&quot;,&quot;target&quot;:&quot;gm-ma-interpret-upper-limb-imaging&quot;,&quot;kind&quot;:&quot;integration&quot;},{&quot;source&quot;:&quot;gm-pa-assess-hand-function&quot;,&quot;target&quot;:&quot;gm-ma-analyze-wrist-anatomy-relations&quot;,&quot;kind&quot;:&quot;integration&quot;},{&quot;source&quot;:&quot;gm-pa-assess-hand-function&quot;,&quot;target&quot;:&quot;gm-ma-explain-wrist-movements&quot;,&quot;kind&quot;:&quot;integration&quot;},{&quot;source&quot;:&quot;gm-pa-assess-hand-function&quot;,&quot;target&quot;:&quot;gm-ma-explain-finger-thumb-movements&quot;,&quot;kind&quot;:&quot;integration&quot;},{&quot;source&quot;:&quot;gm-pa-assess-hand-function&quot;,&quot;target&quot;:&quot;gm-ma-analyze-power-precision-hook-grips&quot;,&quot;kind&quot;:&quot;integration&quot;},{&quot;source&quot;:&quot;gm-pa-assess-hand-function&quot;,&quot;target&quot;:&quot;gm-ma-explain-carpal-tunnel-syndrome&quot;,&quot;kind&quot;:&quot;integration&quot;},{&quot;source&quot;:&quot;gm-pa-plan-venous-access-assess-perfusion&quot;,&quot;target&quot;:&quot;gm-ma-trace-upper-limb-arterial-tree&quot;,&quot;kind&quot;:&quot;integration&quot;},{&quot;source&quot;:&quot;gm-pa-plan-venous-access-assess-perfusion&quot;,&quot;target&quot;:&quot;gm-ma-locate-upper-limb-pulses&quot;,&quot;kind&quot;:&quot;integration&quot;},{&quot;source&quot;:&quot;gm-pa-plan-venous-access-assess-perfusion&quot;,&quot;target&quot;:&quot;gm-ma-contrast-superficial-deep-veins&quot;,&quot;kind&quot;:&quot;integration&quot;},{&quot;source&quot;:&quot;gm-pa-plan-venous-access-assess-perfusion&quot;,&quot;target&quot;:&quot;gm-ma-plan-upper-limb-venous-access&quot;,&quot;kind&quot;:&quot;integration&quot;},{&quot;source&quot;:&quot;gm-dp-recognize-compartment-threat&quot;,&quot;target&quot;:&quot;gm-ma-map-upper-limb-fascial-compartments&quot;,&quot;kind&quot;:&quot;integration&quot;},{&quot;source&quot;:&quot;gm-dp-recognize-compartment-threat&quot;,&quot;target&quot;:&quot;gm-ma-explain-upper-limb-compartment-syndrome&quot;,&quot;kind&quot;:&quot;integration&quot;},{&quot;source&quot;:&quot;gm-dp-recognize-compartment-threat&quot;,&quot;target&quot;:&quot;gm-ma-predict-functional-effect-neurovascular-injury&quot;,&quot;kind&quot;:&quot;integration&quot;}]};
      const nodes = graphData.nodes;
      const links = graphData.links;

      const typeLabels = {
        cluster: &#x27;Cluster&#x27;,
        key: &#x27;Objetivo clave&#x27;,
        atom: &#x27;Unidad de aprendizaje y evaluación&#x27;,
        assembly: &#x27;Actividad integradora&#x27;,
        anatomyFamily: &#x27;Familia anatómica&#x27;,
        anatomy: &#x27;Entidad anatómica&#x27;
      };

      const colorProbe = document.createElement(&#x27;span&#x27;);
      colorProbe.style.position = &#x27;absolute&#x27;;
      colorProbe.style.visibility = &#x27;hidden&#x27;;
      root.appendChild(colorProbe);
      const resolveColor = token =&gt; {
        colorProbe.style.color = `var(${token})`;
        return getComputedStyle(colorProbe).color;
      };
      const palette = {};
      const refreshPalette = () =&gt; {
        palette.cluster = resolveColor(&#x27;--viz-series-1&#x27;);
        palette.key = resolveColor(&#x27;--viz-series-2&#x27;);
        palette.atom = resolveColor(&#x27;--viz-series-3&#x27;);
        palette.assembly = resolveColor(&#x27;--viz-series-4&#x27;);
        palette.anatomyFamily = resolveColor(&#x27;--viz-series-5&#x27;);
        palette.anatomy = resolveColor(&#x27;--viz-series-5&#x27;);
        palette.neutral = resolveColor(&#x27;--border&#x27;);
        palette.text = resolveColor(&#x27;--foreground&#x27;);
      };
      refreshPalette();

      const showDetail = node =&gt; {
        const isKnowledge = node.type === &#x27;anatomy&#x27; || node.type === &#x27;anatomyFamily&#x27;;
        detailType.textContent = typeLabels[node.type];
        detailTitle.textContent = node.title;
        detailObjectiveLabel.textContent = isKnowledge ? &#x27;Definición&#x27; : &#x27;Objetivo&#x27;;
        detailDescriptionLabel.textContent = isKnowledge ? &#x27;Conexión educativa&#x27; : &#x27;Qué se espera&#x27;;
        detailObjective.textContent = node.objective;
        detailDescription.textContent = node.description;
        detailMeta.textContent = node.meta;
      };
      showDetail(nodes[0]);

      if (typeof ForceGraph3D !== &#x27;function&#x27; || typeof SpriteText !== &#x27;function&#x27; || typeof THREE !== &#x27;object&#x27;) {
        stage.textContent = &#x27;No se pudo cargar la vista tridimensional.&#x27;;
        return;
      }

      const radiusFor = node =&gt; {
        if (node.type === &#x27;cluster&#x27;) return 5.2;
        if (node.type === &#x27;anatomyFamily&#x27;) return 4.2;
        if (node.type === &#x27;assembly&#x27;) return 4;
        if (node.type === &#x27;key&#x27;) return 3.8;
        if (node.type === &#x27;atom&#x27;) return 2.1;
        return 1.8;
      };
      const shouldLabel = node =&gt; [&#x27;cluster&#x27;, &#x27;key&#x27;, &#x27;assembly&#x27;, &#x27;anatomyFamily&#x27;].includes(node.type);
      const makeNodeObject = node =&gt; {
        const radius = radiusFor(node);
        const group = new THREE.Group();
        const sphere = new THREE.Mesh(
          new THREE.SphereGeometry(radius, 18, 14),
          new THREE.MeshLambertMaterial({ color: palette[node.type] })
        );
        group.add(sphere);
        if (shouldLabel(node)) {
          const label = new SpriteText(node.title);
          label.color = palette.text;
          label.textHeight = node.type === &#x27;cluster&#x27; ? 4 : 2.7;
          label.position.y = radius + 2.2;
          label.material.depthWrite = false;
          group.add(label);
        }
        return group;
      };
      const linkColor = link =&gt; {
        if (link.kind === &#x27;integration&#x27;) return palette.assembly;
        if (link.kind === &#x27;knowledge-structure&#x27; || link.kind === &#x27;knowledge-learning&#x27;) return palette.anatomy;
        return palette.neutral;
      };
      const linkWidth = link =&gt; {
        if (link.kind === &#x27;hierarchy&#x27;) return 1.05;
        if (link.kind === &#x27;integration&#x27;) return 0.9;
        if (link.kind === &#x27;knowledge-structure&#x27;) return 0.7;
        return 0.35;
      };

      const graph = ForceGraph3D({ controlType: &#x27;orbit&#x27; })(stage)
        .graphData({ nodes, links })
        .backgroundColor(&#x27;rgba(0,0,0,0)&#x27;)
        .showNavInfo(false)
        .nodeLabel(node =&gt; `${typeLabels[node.type]}: ${node.title}`)
        .nodeThreeObject(makeNodeObject)
        .linkColor(linkColor)
        .linkOpacity(0.3)
        .linkWidth(linkWidth)
        .onNodeClick(node =&gt; {
          showDetail(node);
          const distance = 90;
          const length = Math.hypot(node.x || 0, node.y || 0, node.z || 0) || 1;
          const ratio = 1 + distance / length;
          graph.cameraPosition(
            { x: (node.x || 0) * ratio, y: (node.y || 0) * ratio, z: (node.z || 0) * ratio },
            node,
            650
          );
        });

      graph.d3Force(&#x27;charge&#x27;).strength(-95);
      graph.d3Force(&#x27;link&#x27;).distance(link =&gt; link.kind === &#x27;knowledge-learning&#x27; ? 46 : 34);

      const resize = () =&gt; {
        graph.width(stage.clientWidth);
        graph.height(stage.clientHeight);
      };
      resize();
      const observer = new ResizeObserver(resize);
      observer.observe(stage);
      setTimeout(() =&gt; graph.zoomToFit(700, 38), 450);

      const themeObserver = new MutationObserver(() =&gt; {
        refreshPalette();
        graph.nodeThreeObject(makeNodeObject).linkColor(linkColor);
      });
      themeObserver.observe(document.documentElement, { attributes: true, attributeFilter: [&#x27;class&#x27;, &#x27;style&#x27;, &#x27;data-theme&#x27;] });
    })();
  &lt;/script&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;
  let lastPointerWasTouch = false;
  let pinnedByTouch = false;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    pinnedByTouch = false;
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handlePointer = (event) =&gt; {
    lastPointerWasTouch =
      event.type === &quot;pointerdown&quot; &amp;&amp; event.pointerType === &quot;touch&quot;;
  };
  const handleTouchClick = (event) =&gt; {
    const isTouch = event.pointerType === &quot;touch&quot; || lastPointerWasTouch;
    lastPointerWasTouch = false;
    if (!isTouch || event.detail === 0) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (
      trigger == null ||
      !trigger.isConnected ||
      getContent(trigger).length === 0 ||
      (pinnedByTouch &amp;&amp; activeTrigger === trigger)
    ) {
      if (pinnedByTouch) {
        closeTooltip();
      }
      return;
    }
    openTooltip(trigger);
    pinnedByTouch = activeTrigger === trigger;
    window.setTimeout(() =&gt; {
      if (activeTrigger === trigger &amp;&amp; !trigger.isConnected) {
        closeTooltip(false);
      }
    }, 0);
  };
  const handleLeave = (event) =&gt; {
    if (pinnedByTouch) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    lastPointerWasTouch = false;
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    lastPointerWasTouch = false;
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerdown&quot;, handlePointer);
    document.removeEventListener(&quot;pointercancel&quot;, handlePointer);
    document.removeEventListener(&quot;click&quot;, handleTouchClick);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerdown&quot;, handlePointer);
  document.addEventListener(&quot;pointercancel&quot;, handlePointer);
  document.addEventListener(&quot;click&quot;, handleTouchClick);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;
