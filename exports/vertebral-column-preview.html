.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

@media (pointer: coarse) {
  .btn,
  .form-control,
  .form-select {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control,
  .form-select {
    font-size: max(16px, var(--font-size-normal));
  }

  .form-control[type=&quot;file&quot;]::file-selector-button {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control-color[type=&quot;color&quot;] {
    width: 44px;
    height: 44px;
  }

  .form-control:is(
    [type=&quot;date&quot;],
    [type=&quot;datetime-local&quot;],
    [type=&quot;month&quot;],
    [type=&quot;time&quot;],
    [type=&quot;week&quot;]
  ) {
    min-width: 0;
    max-width: 100%;
    padding-block: 8px;
  }

  .form-check {
    min-height: 44px;
    padding-inline: 15px;
  }

  .form-check-input {
    position: relative;
  }

  .form-check-input::after {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    content: &quot;&quot;;
    transform: translate(-50%, -50%);
  }

  .form-check-label {
    display: inline-flex;
    min-width: 44px;
    min-height: 44px;
    align-items: center;
  }

  .form-range {
    height: 44px;
    touch-action: pan-y;
  }

  .form-range::-webkit-slider-runnable-track {
    height: 44px;
  }

  .form-range::-moz-range-track {
    height: 44px;
  }

  .form-range::-webkit-slider-thumb {
    margin-top: 12px;
  }
}

svg {
  display: block;

#widget &gt; svg {

svg.lucide {

.text-destructive {

}

  &lt;script&gt;
    (() =&gt; {
      const root = document.getElementById(&#x27;mia-vertebral-graph&#x27;);
      const stage = document.getElementById(&#x27;mia-vertebral-stage&#x27;);
      const detailType = document.getElementById(&#x27;mia-vertebral-detail-type&#x27;);

      const detailObjectiveLabel = document.getElementById(&#x27;mia-vertebral-detail-objective-label&#x27;);

      const detailObjective = document.getElementById(&#x27;mia-vertebral-detail-objective&#x27;);
      const detailDescription = document.getElementById(&#x27;mia-vertebral-detail-description&#x27;);
      const detailMeta = document.getElementById(&#x27;mia-vertebral-detail-meta&#x27;);

      const nodes = [
        {
          id: &#x27;cluster&#x27;, type: &#x27;cluster&#x27;, title: &#x27;Columna vertebral&#x27;,
          objective: &#x27;Integra la anatomía estructural, funcional, neuroanatómica e imagenológica de la columna vertebral para examinar la espalda, explicar lesiones frecuentes y planificar procedimientos neuraxiales con seguridad.&#x27;,
          description: &#x27;Reconoce estructuras y regiones, explica estabilidad y movimiento, localiza disco, canal, meninges, raíces y nervios, interpreta imágenes y aplica la anatomía a exploración, compresión neural y procedimientos simulados.&#x27;,
          meta: &#x27;7 objetivos clave · 18 unidades evaluables · 3 actividades integradoras · 11 entidades anatómicas&#x27;
        },
        {
          id: &#x27;ko-morfologia&#x27;, type: &#x27;key&#x27;, title: &#x27;Morfología regional de las vértebras&#x27;,
          objective: &#x27;Analiza la morfología de una vértebra para determinar su región y su carácter típico o atípico.&#x27;,
          description: &#x27;Distingue los rasgos regionales y justifica la identificación de atlas, axis y otras vértebras atípicas.&#x27;, meta: &#x27;Objetivo clave · 2 unidades evaluables&#x27;
        },
        {
          id: &#x27;ko-discos&#x27;, type: &#x27;key&#x27;, title: &#x27;Articulaciones, discos y compresión neural&#x27;,
          objective: &#x27;Relaciona la estructura de las articulaciones y discos intervertebrales con la transmisión de cargas, el movimiento y la compresión neurológica.&#x27;,
          description: &#x27;Explica la biomecánica normal y usa las relaciones entre disco, canal, foramen y raíces para predecir una compresión.&#x27;, meta: &#x27;Objetivo clave · 2 unidades evaluables&#x27;
        },
        {
          id: &#x27;ko-movimiento&#x27;, type: &#x27;key&#x27;, title: &#x27;Curvaturas, movimiento regional y lesiones&#x27;,
          objective: &#x27;Explica cómo la organización regional de la columna determina sus curvaturas, movimientos y patrones de lesión.&#x27;,
          description: &#x27;Relaciona curvaturas con función, predice movilidad regional y explica las consecuencias anatómicas de mecanismos frecuentes de lesión.&#x27;, meta: &#x27;Objetivo clave · 3 unidades evaluables&#x27;
        },
        {
          id: &#x27;ko-examen&#x27;, type: &#x27;key&#x27;, title: &#x27;Superficie, estabilidad y examen de espalda&#x27;,
          objective: &#x27;Aplica músculos, ligamentos y referencias superficiales para explicar la estabilidad y realizar una exploración anatómica de la espalda.&#x27;,
          description: &#x27;Localiza referencias, diferencia estabilización activa y pasiva y ejecuta una exploración estructurada en simulación.&#x27;, meta: &#x27;Objetivo clave · 3 unidades evaluables&#x27;
        },
        {
          id: &#x27;ko-meninges&#x27;, type: &#x27;key&#x27;, title: &#x27;Meninges, raíces y procedimientos neuraxiales&#x27;,
          objective: &#x27;Aplica las relaciones entre canal vertebral, meninges, médula y raíces para localizar compresión y planificar accesos neuraxiales seguros.&#x27;,
          description: &#x27;Reconstruye compartimentos y trayectos para planificar punción lumbar y diferenciar accesos epidural e intratecal.&#x27;, meta: &#x27;Objetivo clave · 3 unidades evaluables&#x27;
        },
        {
          id: &#x27;ko-nervio&#x27;, type: &#x27;key&#x27;, title: &#x27;Formación y distribución del nervio espinal&#x27;,
          objective: &#x27;Reconstruye un nervio espinal típico y relaciona sus componentes con la distribución motora, cutánea y autonómica.&#x27;,
          description: &#x27;Distingue raíz, ganglio, nervio y ramos, y usa esa arquitectura para inferir déficits según el sitio de lesión.&#x27;, meta: &#x27;Objetivo clave · 2 unidades evaluables&#x27;
        },
        {
          id: &#x27;ko-imagen&#x27;, type: &#x27;key&#x27;, title: &#x27;Imagen anatómica de la columna vertebral&#x27;,
          objective: &#x27;Interpreta la anatomía de la columna vertebral en modalidades de imagen estándar y la aplica a orientación, alineación y procedimientos.&#x27;,
          description: &#x27;Orienta e identifica estructuras en radiografía, CT, MRI y ultrasonido neuraxial con casos e imágenes nuevas.&#x27;, meta: &#x27;Objetivo clave · 3 unidades evaluables&#x27;
        },

        { id: &#x27;ma-clasificar&#x27;, type: &#x27;atom&#x27;, parent: &#x27;ko-morfologia&#x27;, title: &#x27;Clasificar una vértebra por región&#x27;, objective: &#x27;Clasifica una vértebra aislada como cervical, torácica, lumbar, sacra o coccígea utilizando sus rasgos anatómicos discriminadores.&#x27;, description: &#x27;Orienta el espécimen o imagen, identifica rasgos regionales y justifica una sola clasificación sin depender de una vista memorizada.&#x27;, meta: &#x27;Evidencia: A1 · A2 · A4&#x27; },
        { id: &#x27;ma-atipicas&#x27;, type: &#x27;atom&#x27;, parent: &#x27;ko-morfologia&#x27;, title: &#x27;Reconocer atlas, axis y vértebras atípicas&#x27;, objective: &#x27;Reconoce atlas, axis y otras vértebras atípicas relevantes a partir de sus características distintivas.&#x27;, description: &#x27;Identifica la pieza o imagen y señala los rasgos que explican su clasificación y función regional.&#x27;, meta: &#x27;Evidencia: A1 · A2 · A4&#x27; },
        { id: &#x27;ma-biomecanica&#x27;, type: &#x27;atom&#x27;, parent: &#x27;ko-discos&#x27;, title: &#x27;Explicar la biomecánica intervertebral&#x27;, objective: &#x27;Explica cómo los cuerpos vertebrales, discos y articulaciones cigapofisarias distribuyen carga y guían el movimiento.&#x27;, description: &#x27;Integra estructura y función sin convertir el disco en el único elemento de estabilidad ni confundir articulaciones anteriores y posteriores.&#x27;, meta: &#x27;Evidencia: A2 · A3 · A4&#x27; },
        { id: &#x27;ma-compresion&#x27;, type: &#x27;atom&#x27;, parent: &#x27;ko-discos&#x27;, title: &#x27;Predecir compresión por lesión discal&#x27;, objective: &#x27;Predice la estructura neurológica susceptible de compresión a partir del nivel y la dirección de una lesión discal.&#x27;, description: &#x27;Usa las relaciones entre disco, canal, foramen y raíces; no diagnostica radiculopatía únicamente por dolor inespecífico.&#x27;, meta: &#x27;Evidencia: A2 · A3 · A4&#x27; },
        { id: &#x27;ma-curvaturas&#x27;, type: &#x27;atom&#x27;, parent: &#x27;ko-movimiento&#x27;, title: &#x27;Relacionar curvaturas con función&#x27;, objective: &#x27;Relaciona las curvaturas fisiológicas de la columna con soporte, distribución de carga y equilibrio postural.&#x27;, description: &#x27;Reconoce curvaturas regionales normales y explica su función sin confundir variación postural con deformidad estructural.&#x27;, meta: &#x27;Evidencia: A1 · A2 · A3&#x27; },
        { id: &#x27;ma-movimiento&#x27;, type: &#x27;atom&#x27;, parent: &#x27;ko-movimiento&#x27;, title: &#x27;Predecir el movimiento vertebral regional&#x27;, objective: &#x27;Predice el movimiento predominante y sus limitaciones en una región vertebral a partir de su anatomía articular y ligamentaria.&#x27;, description: &#x27;Diferencia flexión, extensión, inclinación y rotación regionales y justifica el patrón desde la geometría anatómica.&#x27;, meta: &#x27;Evidencia: A2 · A3 · A4&#x27; },
        { id: &#x27;ma-lesion&#x27;, type: &#x27;atom&#x27;, parent: &#x27;ko-movimiento&#x27;, title: &#x27;Explicar la base anatómica de una lesión&#x27;, objective: &#x27;Explica la base anatómica y la consecuencia estructural probable de un mecanismo frecuente de lesión vertebral.&#x27;, description: &#x27;Conecta fuerza, región, estructuras vulnerables y posible inestabilidad sin realizar una clasificación traumatológica completa.&#x27;, meta: &#x27;Evidencia: A2 · A3 · A4&#x27; },
        { id: &#x27;ma-superficie&#x27;, type: &#x27;atom&#x27;, parent: &#x27;ko-examen&#x27;, title: &#x27;Identificar referencias de superficie&#x27;, objective: &#x27;Identifica las referencias superficiales principales necesarias para orientar un examen de la espalda.&#x27;, description: &#x27;Localiza referencias en modelo o persona simulada y reconoce la incertidumbre de la palpación y la variación corporal.&#x27;, meta: &#x27;Evidencia: A1 · A3 · A4&#x27; },
        { id: &#x27;ma-estabilidad&#x27;, type: &#x27;atom&#x27;, parent: &#x27;ko-examen&#x27;, title: &#x27;Explicar la estabilidad musculoligamentaria&#x27;, objective: &#x27;Explica cómo los principales grupos musculares y ligamentos contribuyen al movimiento y la estabilidad vertebral.&#x27;, description: &#x27;Relaciona estructura, tensión y acción regional y distingue estabilización activa de restricción ligamentaria pasiva.&#x27;, meta: &#x27;Evidencia: A2 · A3 · A4&#x27; },
