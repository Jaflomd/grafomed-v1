  - schema: grafomed-object.v1
    id: gm-illness-script-genital-herpes
    object_type: illness_script
    layer: assemblies
    label: Illness script - genital herpes in an anogenital-ulcer presentation
    definition: A condition-centered recognition and discrimination projection for genital herpes; it ends before definitive management.
    member_refs:
      - gm-condition-genital-herpes
      - gm-clinical-finding-anogenital-ulcer
      - gm-test-hsv-lesion-naat-or-culture
    enabling_conditions:
      - sexual exposure and anogenital contact
      - first recognized episode or recurrence
      - host and HIV context can alter presentation
    fault:
      - HSV infection with mucocutaneous replication, latency, and possible reactivation
    consequences:
      manifestations:
        - vesicles, erosions, or ulcers that may be multiple and painful
        - dysuria, itching, discharge, tender nodes, or systemic symptoms in a first episode
        - atypical fissures or late-stage ulcers without classic vesicles
      course:
        - first episodes may be more extensive and prolonged than recurrent episodes
        - recurrence supports HSV but does not replace direct testing when a lesion is available
    discriminators:
      raise_plausibility:
        - recurrent or clustered vesicular-ulcerative lesions
        - pain, dysuria, and tender lymphadenopathy
      lower_or_redirect_plausibility:
        - a solitary indurated painless lesion raises primary syphilis but is not definitive
        - progressive unusual, bleeding, necrotic, or nonresponsive lesions require a broader differential
      confirmation:
        - type-specific lesion NAAT is preferred where available; culture is an alternative
    boundaries:
      - Classic morphology is probabilistic because clinical diagnosis alone is inaccurate.
      - Treatment, suppression, pregnancy management, prognosis, and counseling live in DETcSp or future pathways.
    lifecycle: graph_drafted
    evidence_status: source_locked_candidate
    validation_status: structural_pass
    review_status: pending
    source_refs: [SRC-WHO-STI-2021, SRC-CDC-GUD-2021, SRC-UW-STD-CURRICULUM-2026]
    claim_refs: [CLM-GUD-01, CLM-GUD-02, CLM-GUD-04, CLM-GUD-12]
    tags:
      - {axis: clinical_area, code: CLIN-DERMATOLOGY, role: primary, weight: 0.85, provenance: source_synthesis}
      - {axis: clinical_area, code: CLIN-INFECTIOUS-DISEASES, role: primary, weight: 0.9, provenance: source_synthesis}
      - {axis: learning_function, code: FUNC-RECOGNITION, role: primary, weight: 0.9, provenance: objective_OBJ-GUD-01}
      - {axis: learning_function, code: FUNC-DIFFERENTIAL, role: primary, weight: 0.85, provenance: objective_OBJ-GUD-02}
    provenance:
      <<: *assembly_provenance
      source_refs: [SRC-WHO-STI-2021, SRC-CDC-GUD-2021, SRC-UW-STD-CURRICULUM-2026]
    duplicate_reuse_check:
      <<: *new_assembly
      reuse_classification: condition_specific

  - schema: grafomed-object.v1
    id: gm-detcsp-gud-initial-management
    object_type: detcsp_pathway
    layer: assemblies
    label: Mini-DETcSp - anogenital ulcer initial management
    definition: A bounded workflow assembly that turns illness-script recognition into six observable first-visit management commitments.
    member_refs:
      - gm-differential-set-anogenital-ulcer
      - gm-illness-script-genital-herpes
      - gm-decision-gud-diagnosis-confirmation
      - gm-decision-gud-actionable-context
      - gm-decision-gud-same-day-treatment
      - gm-decision-gud-complication-escalation
      - gm-decision-gud-follow-up
      - gm-decision-gud-prognosis-communication
    stages:
      D:
        decision_ref: gm-decision-gud-diagnosis-confirmation
        commitment: select a diagnostic bundle and state residual uncertainty
      E:
        decision_ref: gm-decision-gud-actionable-context
        commitment: classify only the resource or risk state that changes conduct
      T:
        decision_ref: gm-decision-gud-same-day-treatment
        commitment: choose same-day etiologic, syndromic, presumptive, or escalation management
      C:
        decision_ref: gm-decision-gud-complication-escalation
        commitment: act on serious, special-population, persistent, or non-STI alternatives
      S:
        decision_ref: gm-decision-gud-follow-up
        commitment: schedule result review, reassessment, and failure handling
      P:
        decision_ref: gm-decision-gud-prognosis-communication
        commitment: communicate course, transmission, prevention, privacy, and uncertainty
    loops:
      - S returns to E when response or results change the actionable state.
      - S returns to D and the illness-script layer when the course no longer fits the working diagnosis.
    boundaries:
      - The pathway ends after first-visit decisions and the initial reassessment plan.
      - It is an educational graph assembly, not a prescribing or bedside tool.
    lifecycle: graph_drafted
    evidence_status: source_locked_candidate
    validation_status: structural_pass
    review_status: pending
    source_refs: [SRC-MINSA-NTS240-2026, SRC-WHO-STI-2021, SRC-CDC-GUD-2021]
    claim_refs: [CLM-GUD-02, CLM-GUD-03, CLM-GUD-04, CLM-GUD-05, CLM-GUD-07, CLM-GUD-09, CLM-GUD-10]
    tags:
