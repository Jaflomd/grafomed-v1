nodes:
  - schema: grafomed-object.v1
    id: gm-differential-set-anogenital-ulcer
    object_type: differential_set
    layer: assemblies
    label: Initial differential for an anogenital ulcer
    definition: A bounded first-visit differential that separates common high-consequence infections from context-dependent infectious and noninfectious alternatives.
    summary: HSV and primary syphilis are mandatory contrasts; less common infections and non-STI causes remain explicit without being inflated into unsupported nodes.
    member_refs:
      - gm-condition-genital-herpes
      - gm-condition-primary-syphilis
    deferred_member_labels:
      infectious:
        - chancroid
        - lymphogranuloma venereum
        - donovanosis
        - mpox
        - yeast or other locally relevant infection
      noninfectious:
        - trauma
        - carcinoma
        - aphthous ulcer or Behcet disease
        - fixed drug eruption
        - psoriasis or other inflammatory dermatosis
    discriminating_principles:
      - Morphology and pain change probability but do not establish etiology.
      - Geographic and population epidemiology determine whether rare infections enter initial testing or treatment.
      - Persistence, atypia, or nonresponse broadens the differential and triggers referral or biopsy consideration.
    boundaries:
      - Deferred members are labels in this packet, not canonical condition nodes.
      - A future slice may promote a deferred member only after its own source and duplicate checks.
    lifecycle: graph_drafted
    evidence_status: source_locked_candidate
    validation_status: structural_pass
    review_status: pending
    source_refs: [SRC-MINSA-NTS240-2026, SRC-WHO-STI-2021, SRC-CDC-GUD-2021]
    claim_refs: [CLM-GUD-01, CLM-GUD-02, CLM-GUD-09, CLM-GUD-10]
    tags:
      - {axis: clinical_area, code: CLIN-DERMATOLOGY, role: primary, weight: 0.9, provenance: source_synthesis}
      - {axis: clinical_area, code: CLIN-INFECTIOUS-DISEASES, role: primary, weight: 0.9, provenance: source_synthesis}
      - {axis: organ_system, code: SYS-INTEGUMENTARY, role: primary, weight: 0.85, provenance: source_synthesis}
      - {axis: learning_function, code: FUNC-DIFFERENTIAL, role: primary, weight: 0.95, provenance: objective_OBJ-GUD-02}
    competency_refs: [AAMC-CORE-EPA-02, CANMEDS15-ME-EC-01.06, CANMEDS15-ME-EC-02.02]
    provenance: &assembly_provenance
      created_by: mia
      created_at: "2026-08-26T16:24:00-05:00"
      packet_id: slice-genital-ulcer-syndrome-initial-management-v0
      source_refs: [SRC-MINSA-NTS240-2026, SRC-WHO-STI-2021, SRC-CDC-GUD-2021]
