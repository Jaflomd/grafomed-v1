      - {axis: learning_function, code: FUNC-DIFFERENTIAL, role: primary, weight: 0.85, provenance: assessment_blueprint}
      - {axis: learning_function, code: FUNC-TREATMENT, role: secondary, weight: 0.75, provenance: assessment_blueprint}
      - {axis: route_intent, code: ROUTE-EXAM-PREP, role: secondary, weight: 0.6, provenance: assessment_blueprint}
    competency_refs: [AAMC-CORE-EPA-02, AAMC-CORE-EPA-03, AAMC-CORE-EPA-04, CANMEDS15-ME-EC-02.02, CANMEDS15-ME-EC-02.04]
    provenance:
      <<: *learning_provenance
      source_refs: [SRC-MINSA-NTS240-2026, SRC-WHO-STI-2021, SRC-WHO-GUD-SR-2021, SRC-CDC-GUD-2021, SRC-UW-STD-CURRICULUM-2026]
    duplicate_reuse_check: *new_learning
