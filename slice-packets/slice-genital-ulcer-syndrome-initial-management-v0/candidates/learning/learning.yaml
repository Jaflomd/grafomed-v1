  - schema: grafomed-object.v1
    id: gm-mastery-gud-initial-management
    object_type: mastery_atom
    layer: learning_representation
    label: Commit to and communicate the bounded initial management state
    definition: Given the workup and local context, the learner selects same-day etiologic, syndromic, presumptive, or escalation management and defines follow-up and uncertainty communication.
    observable_performance:
      - uses jurisdiction and same-day test availability to select the management branch
      - recognizes escalation boundaries and does not overextend the general pathway
      - states result revision and seven-day or earlier failure criteria
      - communicates prevention, partner, privacy, and uncertainty information
    evidence_object_refs:
