  - schema: grafomed-object.v1
    id: gm-assessment-gud-v0
    object_type: assessment
    layer: learning_representation
    label: Experimental assessment - anogenital ulcer initial management v0
    definition: Five original single-best-answer items, one remediation branch, and one transfer case mapped to the two mastery atoms.
    psychometric_status: experimental_unvalidated
    copied_external_items: false
    items:
      - id: MCQ-GUD-01
        target_ref: gm-mastery-gud-evaluation
        stem: A sexually active adult presents with a new painful genital ulcer. Which initial approach best reflects the evidence base?
        options:
          A: Diagnose genital herpes from pain and start treatment without further evaluation.
          B: Diagnose primary syphilis only if the ulcer is painless and indurated.
          C: Evaluate for syphilis, test the lesion for HSV when available, offer HIV testing, and keep the etiologic differential open.
          D: Delay all testing until the lesion has persisted for three weeks.
        correct_answer: C
        rationale: Clinical appearance alone is frequently inaccurate. Initial evaluation includes syphilis assessment, direct HSV lesion testing when available, and HIV testing while preserving uncertainty.
        source_map: [CLM-GUD-02, CLM-GUD-03, CLM-GUD-04]
        status: experimental
      - id: MCQ-GUD-02
        target_ref: gm-mastery-gud-evaluation
        stem: A patient has had a genital ulcer for ten days and an initial syphilis serology is nonreactive. What is the safest interpretation?
        options:
          A: Primary syphilis is definitively excluded.
          B: Early primary syphilis remains possible; management should integrate timing, direct testing when available, local protocol, and follow-up.
          C: The result proves genital herpes.
          D: No further evaluation is required unless a rash appears.
        correct_answer: B
        rationale: Syphilitic ulceration can precede detectable antibodies, so an early negative serology cannot close the syphilis branch.
        source_map: [CLM-GUD-06]
        status: experimental
      - id: MCQ-GUD-03
        target_ref: gm-mastery-gud-initial-management
        stem: Two clinics evaluate otherwise similar confirmed anogenital ulcers. Clinic A has quality-assured lesion NAAT with same-day results. Clinic B has no molecular testing. Which principle best explains why their initial pathways can differ?
        options:
          A: Morphology is reliable only in Clinic A.
          B: Syphilis serology is unnecessary in Clinic B.
          C: Clinic B should always wait for referral before treating.
          D: Same-day etiologic treatment is feasible in Clinic A, whereas Clinic B may require same-day syndromic management under the applicable protocol.
        correct_answer: D
        rationale: The management branch is resource-sensitive. WHO distinguishes same-day molecular-result pathways from limited or absent molecular capacity, where syndromic treatment prevents delay.
        source_map: [CLM-GUD-04, CLM-GUD-05]
        status: experimental
      - id: MCQ-GUD-04
        target_ref: gm-mastery-gud-initial-management
        stem: In a Peruvian first-level facility following NTS 240, a genital ulcer is confirmed. Which management-state description is most accurate for this bounded slice?
        options:
          A: Provide immediate syndromic coverage for the frequent HSV and syphilis etiologies under the current national protocol, offer rapid STI testing, counsel, and arrange seven-day review.
          B: Treat only when the lesion morphology proves one etiology.
          C: Apply the CDC algorithm as the legal national standard in Peru.
          D: Defer counseling and partner actions until every laboratory result is final.
        correct_answer: A
        rationale: Peru NTS 240 defines a first-level syndromic pathway that covers HSV and syphilis, incorporates rapid testing and counseling, and schedules clinical review. The exact regimen remains protocol- and patient-context dependent.
        source_map: [CLM-GUD-03, CLM-GUD-07, CLM-GUD-08]
        status: experimental
      - id: MCQ-GUD-05
        target_ref: gm-mastery-gud-initial-management
        stem: A genital ulcer has not improved at the planned reassessment despite completion of the initial syndrome pathway. What is the best next action?
        options:
          A: Repeat the same treatment indefinitely because the initial syndrome label is fixed.
          B: Close the case if initial rapid tests were nonreactive.
          C: Reopen the diagnosis, review results and adherence, and refer for broader testing or biopsy when the ulcer is persistent or unusual.
          D: Diagnose a noninfectious ulcer without further evaluation.
        correct_answer: C
        rationale: Nonresponse is a state change. MINSA and WHO direct referral for persistent disease, and CDC notes that unusual or nonresponsive ulcers may require biopsy.
        source_map: [CLM-GUD-07, CLM-GUD-09, CLM-GUD-10]
        status: experimental
    remediation_branch:
      id: REM-GUD-PATTERN-ONLY-01
      trigger: The learner chooses an etiology from morphology alone or treats an early negative syphilis test as exclusion.
      error_pattern: morphology_as_diagnosis
      steps:
        - Revisit CLM-GUD-02 and the uncertainty register.
        - Contrast two cases with identical morphology but different molecular results.
        - Re-answer MCQ-GUD-01 and MCQ-GUD-02 with a written uncertainty statement.
      success_evidence: Correct answers plus an explanation that morphology updates probability but does not establish etiology.
    transfer_case:
      id: CASE-GUD-TRANSFER-01
      synthetic: true
      prompt: A person with recurrent oral aphthae and a new painful vulvar ulcer has negative same-day HSV lesion NAAT and nonreactive initial syphilis serology. The ulcer persists at review. Build the next plan without assuming that the tests prove a single diagnosis.
      expected_performance:
        - retains the early-syphilis timing caveat if exposure and timing remain plausible
        - broadens toward inflammatory, aphthous, traumatic, drug-related, and malignant causes
        - escalates persistent unusual disease for expert evaluation and possible biopsy
        - communicates uncertainty and prevention while results and evaluation evolve
      source_map: [CLM-GUD-06, CLM-GUD-09, CLM-GUD-10]
    boundaries:
      - Items are not validated for grading, licensing, or high-stakes decisions.
      - The transfer case is synthetic and contains no patient-identifiable data.
    lifecycle: graph_drafted
    evidence_status: source_locked_candidate
    validation_status: structural_pass
    review_status: pending
    source_refs: [SRC-MINSA-NTS240-2026, SRC-WHO-STI-2021, SRC-WHO-GUD-SR-2021, SRC-CDC-GUD-2021, SRC-UW-STD-CURRICULUM-2026]
    claim_refs: [CLM-GUD-02, CLM-GUD-03, CLM-GUD-04, CLM-GUD-05, CLM-GUD-06, CLM-GUD-07, CLM-GUD-08, CLM-GUD-09, CLM-GUD-10, CLM-GUD-12]
    tags:
