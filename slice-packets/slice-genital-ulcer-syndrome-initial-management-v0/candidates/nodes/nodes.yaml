      - {axis: learning_function, code: FUNC-STRATIFICATION, role: primary, weight: 0.9, provenance: objective_OBJ-GUD-04}
      - {axis: learning_function, code: FUNC-SAFETY, role: secondary, weight: 0.75, provenance: uncertainty_register}
      - {axis: competency_framework, code: COMP-CANMEDS-2015, role: secondary, weight: 0.65, provenance: competency_alignment}
