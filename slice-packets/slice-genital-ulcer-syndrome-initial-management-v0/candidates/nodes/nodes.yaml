  - schema: grafomed-object.v1
    id: gm-decision-gud-same-day-treatment
    object_type: decision_atom
    layer: medical_truth
    label: T - Commit to same-day etiologic, syndromic, or escalation management
    definition: Select the first management state using the actionable context rather than waiting reflexively or applying one protocol universally.
    trigger: An actionable context has been classified.
    actor: licensed clinician or supervised learner under local policy
    inputs:
      - same-day actionable test results
      - jurisdiction-specific protocol
      - molecular-test availability and turnaround
      - lesion pattern, prior syphilis treatment, allergies, contraindications, pregnancy, and immune status
    alternatives:
      - treat according to same-day etiologic results and revise when new results arrive
      - provide same-day syndromic coverage for syphilis and HSV under the applicable protocol
      - provide suspicion-based presumptive treatment while testing under the applicable protocol
      - escalate before routine first-level treatment when a boundary is crossed
    discriminators:
      - Peru NTS 240 first-level syndromic pathway versus WHO or CDC contexts
      - same-day quality-assured molecular results versus delayed or absent results
      - recent syphilis treatment and recurrent or vesicular presentation
      - allergy, pregnancy, immunocompromise, or atypical disease
    output: A documented treatment or escalation commitment with rationale and uncertainty.
    downstream_consequence: The person receives timely care, counseling, and a defined reassessment plan.
    error_costs:
      - delayed treatment and ongoing transmission
      - inappropriate regimen from jurisdiction collapse
      - avoidable adverse effects or contraindicated treatment
      - failure to revisit management when delayed results arrive
    assessment_evidence: [MCQ-GUD-03, MCQ-GUD-04]
    boundaries:
      - Exact drug and dose selection must be read from the current local protocol and patient context.
      - This object does not encode recurrent suppression, neurosyphilis, pregnancy treatment, or complex allergy management.
    lifecycle: graph_drafted
    evidence_status: source_locked_candidate
    validation_status: structural_pass
    review_status: pending
    source_refs: [SRC-MINSA-NTS240-2026, SRC-WHO-STI-2021, SRC-CDC-GUD-2021]
    claim_refs: [CLM-GUD-04, CLM-GUD-05, CLM-GUD-07, CLM-GUD-08]
    tags:
      - {axis: clinical_area, code: CLIN-INFECTIOUS-DISEASES, role: primary, weight: 0.9, provenance: source_synthesis}
      - {axis: learning_function, code: FUNC-TREATMENT, role: primary, weight: 0.95, provenance: objective_OBJ-GUD-04}
      - {axis: learning_function, code: FUNC-SAFETY, role: secondary, weight: 0.75, provenance: uncertainty_register}
      - {axis: competency_framework, code: COMP-AAMC-CORE-EPA, role: secondary, weight: 0.7, provenance: competency_alignment}
      - {axis: competency_framework, code: COMP-CANMEDS-2015, role: secondary, weight: 0.7, provenance: competency_alignment}
    competency_refs: [AAMC-CORE-EPA-04, CANMEDS15-ME-EC-02.04, CANMEDS15-ME-EC-03.01, CANMEDS15-ME-EC-03.03]
    provenance:
