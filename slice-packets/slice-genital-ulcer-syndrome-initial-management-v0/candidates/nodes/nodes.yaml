  - schema: grafomed-object.v1
    id: gm-decision-gud-diagnosis-confirmation
    object_type: decision_atom
    layer: medical_truth
    label: D - Select the initial genital-ulcer diagnostic workup
    definition: Commit to the first evaluation bundle that can distinguish etiologies and alter same-day management without treating morphology as diagnosis.
    trigger: A genital, anal, or perianal ulcer is confirmed on examination.
    actor: clinician or supervised learner
    inputs:
      - medical and sexual history, including timing, recurrence, exposures, prior syphilis treatment, and pregnancy or immunocompromise context
      - genital and anal examination with lesion morphology and distribution
      - local availability and turnaround of quality-assured lesion molecular testing
      - availability and interpretation of syphilis and HIV testing
    alternatives:
      - same-day lesion molecular testing plus syphilis serology and HIV testing
      - delayed lesion testing with same-day syndromic management and later revision
      - no lesion molecular capacity with syndromic management and targeted referral
      - immediate escalation for unusual, persistent, severe, or special-population presentation
    discriminators:
      - confirmed ulcer versus no ulcer
      - same-day actionable result versus delayed or unavailable result
      - early negative syphilis serology with ongoing clinical possibility
      - recurrent or vesicular lesion pattern without assuming certainty
    output: A documented initial diagnostic bundle and explicit residual uncertainty.
    downstream_consequence: The result and resource state determine the actionable context and same-day treatment branch.
    error_costs:
      - missed infectious syphilis or delayed HSV treatment
      - false etiologic certainty from morphology
      - avoidable testing or failure to test for HIV
      - failure to recognize a non-STI or escalation condition
    assessment_evidence: [MCQ-GUD-01, MCQ-GUD-02, MCQ-GUD-03]
    boundaries:
      - This is an educational decision atom, not patient-specific decision support.
      - Exact tests depend on jurisdiction and operational laboratory quality.
    lifecycle: graph_drafted
    evidence_status: source_locked_candidate
    validation_status: structural_pass
    review_status: pending
    source_refs: [SRC-MINSA-NTS240-2026, SRC-WHO-STI-2021, SRC-CDC-GUD-2021]
    claim_refs: [CLM-GUD-02, CLM-GUD-03, CLM-GUD-04, CLM-GUD-06]
    tags: &decision_tags
      - {axis: clinical_area, code: CLIN-DERMATOLOGY, role: primary, weight: 0.8, provenance: source_synthesis}
      - {axis: clinical_area, code: CLIN-INFECTIOUS-DISEASES, role: primary, weight: 0.9, provenance: source_synthesis}
      - {axis: learning_function, code: FUNC-DIAGNOSIS, role: primary, weight: 0.9, provenance: objective_OBJ-GUD-03}
      - {axis: learning_function, code: FUNC-SAFETY, role: secondary, weight: 0.7, provenance: uncertainty_register}
      - {axis: competency_framework, code: COMP-AAMC-CORE-EPA, role: secondary, weight: 0.7, provenance: competency_alignment}
      - {axis: competency_framework, code: COMP-CANMEDS-2015, role: secondary, weight: 0.7, provenance: competency_alignment}
