  - schema: grafomed-object.v1
    id: gm-test-syphilis-evaluation-in-gud
    object_type: test
    layer: medical_truth
    label: Syphilis evaluation in anogenital ulcer disease
    definition: Contextual use of treponemal and nontreponemal serology, and lesion direct testing when available, to evaluate syphilis without falsely excluding very early infection.
    learning_contract:
      objective: Formulate an initial syphilis-testing plan for a person with an anogenital ulcer that accounts for timing, prior treatment, available methods, and residual uncertainty.
      expected_performance: The learner selects the appropriate treponemal and nontreponemal serologic evaluation, considers direct lesion testing when available, and interprets results in relation to exposure and lesion timing. This node excludes complete staging and post-treatment serologic monitoring.
      mastery_evidence: Given a first-visit case and available tests, the learner proposes an appropriate evaluation, interprets an early nonreactive result without closing the syphilis branch, and defines the required repeat testing or follow-up.
    aliases: [syphilis testing in genital ulcer, treponemal and RPR evaluation]
    boundaries:
      - A single early negative serology is not an exclusion edge.
      - Full staging and post-treatment serologic monitoring are outside this slice.
    lifecycle: graph_drafted
    evidence_status: source_locked_candidate
    validation_status: structural_pass
    review_status: pending
