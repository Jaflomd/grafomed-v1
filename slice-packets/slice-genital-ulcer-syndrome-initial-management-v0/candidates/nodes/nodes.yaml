  - schema: grafomed-object.v1
    id: gm-decision-gud-complication-escalation
    object_type: decision_atom
    layer: medical_truth
    label: C - Identify complication and escalation actions
    definition: Select which complications, host factors, and alternative causes require action during or after the first visit.
    trigger: Initial treatment or escalation has been selected.
    actor: clinician or supervised learner
    inputs:
      - severe pain, urinary retention, systemic illness, neurologic or ocular symptoms
      - pregnancy, immunocompromise, HIV status, and medication safety context
      - unusual morphology, persistent disease, trauma, carcinoma, aphthous or inflammatory disease, or drug eruption possibility
    alternatives:
      - routine safety-net within the bounded syndrome pathway
      - urgent or specialty assessment
      - biopsy or broader etiologic evaluation for unusual or nonresponsive ulcer
    discriminators:
      - instability or organ-threatening features
      - high-risk host or pregnancy context
      - failure of the course to fit or respond to the initial syndrome pathway
    output: A documented escalation or complication-prevention plan.
    downstream_consequence: Follow-up timing and destination match the risk rather than the presumed etiology alone.
    error_costs:
      - missed neurologic, ocular, malignant, inflammatory, or severe infectious disease
      - delayed referral after nonresponse
      - unsafe treatment in a special population
    assessment_evidence: [MCQ-GUD-05, CASE-GUD-TRANSFER-01]
    boundaries:
      - Detailed management of each complication is outside this packet.
    lifecycle: graph_drafted
    evidence_status: source_locked_candidate
