    object_type: clinical_finding
    layer: medical_truth
    label: Anogenital ulcer presentation
    definition: A break in genital, anal, or perianal skin or mucosa that may present as an ulcer, sore, erosion, or vesicular lesion and may be painful or painless.
    aliases: [genital ulcer, genital sore, perianal ulcer, anogenital ulcer disease presentation]
    boundaries:
      - This object names the presenting finding, not its etiology.
      - Oral ulcers and isolated anorectal discharge are outside this first slice unless an anogenital ulcer is also present.
