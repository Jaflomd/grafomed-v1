  - schema: grafomed-object.v1
    id: gm-decision-gud-prognosis-communication
    object_type: decision_atom
    layer: medical_truth
    label: P - Communicate prognosis and uncertainty
    definition: Decide what prognosis, prevention, uncertainty, confidentiality, and partner information must be communicated at the first visit.
    trigger: A treatment and follow-up plan exists.
    actor: clinician or supervised learner
    inputs:
      - confirmed versus presumed etiology
      - possibility of absent laboratory confirmation or later result revision
      - transmission, recurrence, symptom course, partner, and prevention implications
      - patient preferences, privacy, stigma, and emotional response
    alternatives:
      - condition-specific counseling when etiology is confirmed
      - uncertainty-centered counseling when treatment is syndromic or presumptive
      - escalation counseling when serious or noninfectious alternatives remain
    discriminators:
      - certainty level and source of uncertainty
      - immediate transmission or partner implications
      - patient comprehension, values, privacy, and distress
    output: A documented, patient-centered explanation with prevention and return instructions.
    downstream_consequence: The person can act safely while the diagnosis and course evolve.
    error_costs:
      - stigma, breach of privacy, or unsupported certainty
      - missed prevention and partner actions
      - poor adherence or loss to follow-up
    assessment_evidence: [MCQ-GUD-04, CASE-GUD-TRANSFER-01]
    boundaries:
