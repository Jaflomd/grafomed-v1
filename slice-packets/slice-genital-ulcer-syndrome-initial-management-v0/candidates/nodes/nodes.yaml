  - schema: grafomed-object.v1
    id: gm-condition-primary-syphilis
    object_type: condition
    layer: medical_truth
    label: Primary syphilis
    definition: The early stage of acquired syphilis in which an inoculation-site lesion may be present before serologic tests become reactive.
    learning_contract:
      objective: Prioritize primary syphilis within the differential diagnosis of an anogenital ulcer using presentation, exposure, and timing data while preserving diagnostic uncertainty.
      expected_performance: The learner recognizes classic and atypical primary-syphilis presentations, treats morphology as suggestive rather than definitive, and keeps very early infection plausible after a nonreactive early serology. This node is limited to the genital-ulcer branch at the first visit and does not include staging or definitive treatment.
      mastery_evidence: In a first-visit vignette, the learner places primary syphilis at an appropriate differential priority and explicitly avoids ruling it in or out solely from classic morphology or an early nonreactive serology.
    aliases: [primary Treponema pallidum infection, syphilitic chancre]
    boundaries:
      - This slice addresses primary syphilis only as a genital-ulcer cause and first-visit management branch.
      - Secondary, latent, congenital, ocular, otic, and neurosyphilis require separate pathways.
    lifecycle: graph_drafted
    evidence_status: source_locked_candidate
    validation_status: structural_pass
    review_status: pending
    source_refs: [SRC-MINSA-NTS240-2026, SRC-WHO-STI-2021, SRC-CDC-GUD-2021, SRC-UW-STD-CURRICULUM-2026]
    claim_refs: [CLM-GUD-01, CLM-GUD-02, CLM-GUD-06, CLM-GUD-12]
    tags:
