  - schema: grafomed-object.v1
    id: gm-decision-gud-actionable-context
    object_type: decision_atom
    layer: medical_truth
    label: E - Classify the actionable genital-ulcer context
    definition: Classify only the resource and clinical states that change initial conduct.
    trigger: The initial ulcer evaluation bundle has been selected or results are available.
    actor: clinician or supervised learner
    inputs:
      - same-day molecular and serologic result availability
      - recurrence or vesicular pattern and recent syphilis-treatment history
      - persistence, atypia, severity, pregnancy, immunocompromise, neurologic or ocular symptoms, and local epidemiology
    alternatives:
      - same-day etiologic-result state
      - limited, delayed, or no molecular-testing state
      - persistent, unusual, severe, or special-population escalation state
      - no confirmed ulcer state
    discriminators:
      - whether a result can change treatment during the visit
      - whether the course or host context exceeds a first-level syndrome pathway
      - whether an ulcer is actually present
    output: One actionable state with the context that justifies it.
    downstream_consequence: The state controls treatment, referral, and follow-up choices.
    error_costs:
      - applying a high-resource algorithm where testing is unavailable
      - treating a special population with an unqualified general pathway
      - failing to escalate a persistent or unusual ulcer
    assessment_evidence: [MCQ-GUD-03, MCQ-GUD-05]
    boundaries:
      - This is not a severity scale and does not invent cutoffs unsupported by the sources.
      - Pregnancy and immunocompromise are escalation contexts, not fully modeled subroutes.
