  - schema: grafomed-object.v1
    id: gm-decision-gud-follow-up
    object_type: decision_atom
    layer: medical_truth
    label: S - Set follow-up, result revision, and failure criteria
    definition: Define when and how delayed results, symptom persistence, response, recurrence, and partner actions will change the plan.
    trigger: Initial management and escalation actions have been selected.
    actor: clinician or supervised learner
    inputs:
      - Peru seven-day reassessment requirement or applicable local follow-up interval
      - pending laboratory results and mechanism for result review
      - expected symptom course and treatment response
      - partner-service and prevention needs
    alternatives:
      - planned seven-day clinical reassessment
      - earlier reassessment for worsening or safety triggers
      - result-triggered treatment revision
      - specialist referral for persistence or nonresponse
    discriminators:
      - improvement or remission versus persistence or worsening
      - actionable delayed result
      - recurrence or course inconsistent with the working diagnosis
    output: A time-bound follow-up and contingency plan understood by the patient.
    downstream_consequence: Failure and new evidence return the pathway to D or E instead of leaving a closed diagnosis.
    error_costs:
      - lost results and untreated infection
      - false reassurance after early negative testing
      - prolonged transmission or delayed alternative diagnosis
    assessment_evidence: [MCQ-GUD-05, CASE-GUD-TRANSFER-01]
    boundaries:
      - Longitudinal recurrent-HSV and syphilis-monitoring pathways are separate future slices.
    lifecycle: graph_drafted
    evidence_status: source_locked_candidate
    validation_status: structural_pass
    review_status: pending
    source_refs: [SRC-MINSA-NTS240-2026, SRC-WHO-STI-2021, SRC-CDC-GUD-2021]
    claim_refs: [CLM-GUD-06, CLM-GUD-07, CLM-GUD-09, CLM-GUD-10]
    tags:
