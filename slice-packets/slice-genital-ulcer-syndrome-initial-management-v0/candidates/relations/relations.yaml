  - <<: *relation
    id: gm-rel-ulcer-supports-primary-syphilis
    target: gm-condition-primary-syphilis
    rationale: An anogenital ulcer is compatible with primary syphilis even when classic painless induration is absent.
    source_refs: [SRC-WHO-STI-2021, SRC-CDC-GUD-2021]
    claim_refs: [CLM-GUD-01, CLM-GUD-02, CLM-GUD-06]

  - <<: *relation
    id: gm-rel-herpes-discriminates-primary-syphilis
    source: gm-condition-genital-herpes
    target: gm-condition-primary-syphilis
    relation_type: discriminates_from
    rationale: Recurrence, vesicles, pain, dysuria, and clustered shallow lesions can raise HSV relative to syphilis, while direct lesion testing is needed for confirmation.
    context: {certainty: probabilistic, confirmatory_test_ref: gm-test-hsv-lesion-naat-or-culture}
    source_refs: [SRC-WHO-STI-2021, SRC-UW-STD-CURRICULUM-2026]
    claim_refs: [CLM-GUD-02, CLM-GUD-12]

