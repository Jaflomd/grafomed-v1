    family: clinical_reasoning
    lifecycle: graph_drafted
    evidence_status: source_locked_candidate
    validation_status: structural_pass
    rationale: An anogenital ulcer is compatible with HSV, but this relation raises plausibility without establishing etiology.
    context: {jurisdiction: global, certainty: probabilistic, morphology_alone_is_diagnostic: false}
