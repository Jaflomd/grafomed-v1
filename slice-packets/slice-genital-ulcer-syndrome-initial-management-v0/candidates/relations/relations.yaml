    source: gm-condition-primary-syphilis
    target: gm-condition-genital-herpes
    relation_type: discriminates_from
    rationale: A papule progressing to a solitary indurated painless ulcer can raise syphilis relative to HSV, but atypical and mixed presentations prevent morphology-only diagnosis.
    context: {certainty: probabilistic, early_negative_serology_excludes: false}
    source_refs: [SRC-WHO-STI-2021, SRC-CDC-GUD-2021]
    claim_refs: [CLM-GUD-02, CLM-GUD-06]

