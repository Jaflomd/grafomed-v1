claim_coverage:
  - id: CLM-GUD-01
    claim: Anogenital ulcer disease is a syndrome with infectious and noninfectious causes; HSV and syphilis are central etiologies, while local prevalence varies.
    support: [SRC-MINSA-NTS240-2026, SRC-WHO-STI-2021, SRC-CDC-GUD-2021]
  - id: CLM-GUD-02
    claim: History and examination alone are insufficient for reliable etiologic diagnosis.
    support: [SRC-WHO-STI-2021, SRC-WHO-GUD-SR-2021, SRC-CDC-GUD-2021]
  - id: CLM-GUD-03
    claim: Initial evaluation includes sexual and medical history, genital and anal examination, and offering HIV and syphilis testing.
    support: [SRC-MINSA-NTS240-2026, SRC-WHO-STI-2021, SRC-CDC-GUD-2021]
  - id: CLM-GUD-04
    claim: Quality-assured same-day lesion molecular testing supports etiologic treatment; limited or delayed testing supports same-day syndromic management.
    support: [SRC-WHO-STI-2021]
  - id: CLM-GUD-05
    claim: Same-day therapy may be required before all results are available, but the precise trigger and coverage depend on jurisdiction and resource context.
    support: [SRC-MINSA-NTS240-2026, SRC-WHO-STI-2021, SRC-CDC-GUD-2021]
  - id: CLM-GUD-06
    claim: A negative syphilis serology early after ulcer onset does not definitively exclude primary syphilis.
    support: [SRC-WHO-STI-2021]
  - id: CLM-GUD-07
    claim: Peru NTS 240 directs immediate syndromic treatment at first-level facilities and clinical review at seven days.
    support: [SRC-MINSA-NTS240-2026]
  - id: CLM-GUD-08
    claim: Peru NTS 240 syndromic coverage targets T. pallidum and HSV and defines a national regimen.
    support: [SRC-MINSA-NTS240-2026]
  - id: CLM-GUD-09
    claim: Less common infectious causes include chancroid, LGV, and donovanosis; persistent or nonresponsive ulcers require broader evaluation or referral.
    support: [SRC-MINSA-NTS240-2026, SRC-WHO-STI-2021, SRC-CDC-GUD-2021]
  - id: CLM-GUD-10
    claim: Unusual or nonresponsive ulcers may require biopsy or specialist evaluation for non-STI causes.
    support: [SRC-CDC-GUD-2021]
  - id: CLM-GUD-11
    claim: A historical Peru clinic study found HSV in 43% of a small sample, but this is not current national prevalence.
    support: [SRC-SANCHEZ-PERU-GUD-2002]
  - id: CLM-GUD-12
    claim: Current clinician education organizes genital herpes and syphilis around epidemiology, manifestations, diagnosis, management, prevention, and applied questions.
    support: [SRC-UW-STD-CURRICULUM-2026]
  - id: CLM-GUD-13
    claim: The slice can align to AAMC EPA 1-4 and selected CanMEDS competencies without making competency a parent of medical truth.
    support: [SRC-AAMC-CORE-EPA-2014, SRC-CANMEDS15-LOCAL]

update_risks:
  - Check MINSA amendments or replacements before promotion or reuse in clinical teaching.
  - Check WHO and CDC guideline updates before each maintained release.
  - Do not infer current Peru etiologic prevalence from the 2002 study.

