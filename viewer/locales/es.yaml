      gm-test-hiv-screening-in-gud: "Evidencia necesaria para evaluar y priorizar una úlcera anogenital; estimación actual del fixture: 0,35."
      gm-decision-gud-diagnosis-confirmation: "Evidencia necesaria para evaluar y priorizar una úlcera anogenital; estimación actual del fixture: 0,35."
      gm-decision-gud-actionable-context: "Evidencia necesaria para evaluar y priorizar una úlcera anogenital; estimación actual del fixture: 0,35."
      gm-decision-gud-same-day-treatment: "Evidencia necesaria para decidir y comunicar el manejo inicial; estimación actual del fixture: 0,20."
      gm-decision-gud-complication-escalation: "Evidencia necesaria para decidir y comunicar el manejo inicial; estimación actual del fixture: 0,20."
      gm-decision-gud-follow-up: "Evidencia necesaria para decidir y comunicar el manejo inicial; estimación actual del fixture: 0,20."
      gm-decision-gud-prognosis-communication: "Evidencia necesaria para decidir y comunicar el manejo inicial; estimación actual del fixture: 0,20."
      gm-detcsp-gud-initial-management: "Evidencia necesaria para decidir y comunicar el manejo inicial; estimación actual del fixture: 0,20."
      gm-assessment-gud-v0: Recoger evidencia observable de ambos átomos de dominio y elegir la siguiente acción de éxito, remediación o transferencia.
  gm-route-gud-gold-v0:
    label: Ruta gold manual — manejo inicial de la úlcera anogenital
    goal: Evaluar una úlcera anogenital y comprometerse con un estado inicial de manejo respaldado por evidencia y ajustado al contexto.
    step_reasons:
      gm-clinical-finding-anogenital-ulcer: Anclar la ruta en el hallazgo de presentación sin asignar etiología.
      gm-condition-genital-herpes: Establecer uno de los dos contrastes etiológicos principales.
      gm-illness-script-genital-herpes: Organizar condiciones facilitadoras, mecanismo, consecuencias y discriminadores sin duplicar el manejo.
      gm-condition-primary-syphilis: Establecer la causa competidora de alto impacto y la salvedad de la serología temprana.
      gm-differential-set-anogenital-ulcer: Priorizar VHS y sífilis manteniendo alternativas infecciosas raras y no infecciosas.
      gm-test-syphilis-evaluation-in-gud: Elegir e interpretar las pruebas de sífilis sin una exclusión temprana falsa.
      gm-test-hsv-lesion-naat-or-culture: Usar pruebas directas de la lesión para reemplazar la certeza basada solo en morfología.
      gm-test-hiv-screening-in-gud: Incluir la prueba necesaria de huésped y prevención sin confundirla con la etiología de la úlcera.
      gm-decision-gud-diagnosis-confirmation: Comprometerse con el estudio inicial y declarar la incertidumbre residual.
      gm-decision-gud-actionable-context: Clasificar los estados de pruebas inmediatas, capacidad limitada o escalamiento que cambian la conducta.
      gm-decision-gud-same-day-treatment: Elegir manejo etiológico, sindrómico, presuntivo o de escalamiento según el protocolo aplicable.
      gm-decision-gud-complication-escalation: Actuar ante alternativas graves, poblaciones especiales, persistencia o causas no infecciosas.
      gm-decision-gud-follow-up: Definir revisión de resultados, reevaluación, falla y circuitos de referencia.
      gm-decision-gud-prognosis-communication: Comunicar pronóstico, prevención, privacidad, acciones sobre parejas e incertidumbre.
      gm-detcsp-gud-initial-management: Integrar D-E-T-C-S-P como un desempeño coherente y acotado.
      gm-assessment-gud-v0: Recoger evidencia y derivar hacia transferencia o remediación dirigida.
