  gm-route-gud-generated-v0:
    label: Ruta generada — manejo inicial de la úlcera anogenital
    goal: Evaluar una úlcera anogenital y comprometerse con un estado inicial de manejo respaldado por evidencia y ajustado al contexto.
    step_reasons:
      gm-clinical-finding-anogenital-ulcer: "Evidencia necesaria para evaluar y priorizar una úlcera anogenital; estimación actual del fixture: 0,35."
